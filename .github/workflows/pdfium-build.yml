# Builds PDFium with MegaPDF's patch series (tools/pdfium/patches) for every target
# the apps ship, and optionally publishes the set as a release in this repository
# (#119, #120). Manual only: a full run is hours of runner time.
#
# Each target runs tools/pdfium/build-pdfium.sh, which drives bblanchon/pdfium-binaries
# at the tag matching the pinned Chromium branch, and produces an archive named like
# the upstream releases (pdfium-<os>[-<env>]-<cpu>.tgz) with VERSION recording the
# patch count and a hash of the series.
name: PDFium (patched) build

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Chromium branch
        required: false
        default: chromium/7934
      release:
        description: Publish the archives as a release of this repository
        type: boolean
        required: false
        default: false
      targets:
        description: >-
          Which targets to build: "all", or a space-separated list of archive names
          without the pdfium- prefix, e.g. "win-arm64"
        required: false
        default: all
      attach_to:
        description: >-
          Add the archives to this existing release (a pdfium-<build>-megapdf-<series>
          tag) instead of publishing a new one. Refused unless every archive's VERSION
          matches the release's, and an asset the release already has is never replaced.
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.env }} ${{ matrix.cpu }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux,   cpu: x64,   env: '',        runner: ubuntu-24.04 }
          # linux-arm64 (#254 A6): the patched series cross-builds for it from the
          # same runner as x64 — pdfium-binaries handles the target and downloads the
          # arm64 sysroot itself. The app cannot ship from it yet; see
          # tools/Linux-Packaging.md for the three things still missing.
          - { os: linux,   cpu: arm64, env: '',        runner: ubuntu-24.04 }
          - { os: android, cpu: arm64, env: '',        runner: ubuntu-24.04 }
          - { os: android, cpu: x64,   env: '',        runner: ubuntu-24.04 }
          - { os: win,     cpu: x64,   env: '',        runner: windows-2022 }
          # win-arm64 (#288): cross-built on the x64 runner, as pdfium-binaries does for
          # its own win-arm64 release. The Store's ARM64 package needs it: before this,
          # that package shipped the x64 DLL and could not load it.
          - { os: win,     cpu: arm64, env: '',        runner: windows-2022 }
          - { os: mac,     cpu: arm64, env: '',        runner: macos-15 }
          - { os: mac,     cpu: x64,   env: '',        runner: macos-15 }
          - { os: ios,     cpu: arm64, env: device,    runner: macos-15 }
          - { os: ios,     cpu: arm64, env: simulator, runner: macos-15 }
          - { os: ios,     cpu: x64,   env: simulator, runner: macos-15 }
    # A target outside `targets` still gets a runner, and every step skips at once
    # (a job-level `if` cannot see the matrix).
    env:
      WANTED: ${{ inputs.targets == 'all' || contains(format(' {0} ', inputs.targets), format(' {0}{1}-{2} ', matrix.os, matrix.env && format('-{0}', matrix.env) || '', matrix.cpu)) }}
    steps:
      - uses: actions/checkout@v4
        if: env.WANTED == 'true'
      - name: Build
        if: env.WANTED == 'true'
        shell: bash
        env:
          PDFIUM_BRANCH: ${{ inputs.branch }}
        run: bash tools/pdfium/build-pdfium.sh "$RUNNER_TEMP/pdfium-build" ${{ matrix.os }} ${{ matrix.cpu }} ${{ matrix.env }}
      - name: Show VERSION
        if: env.WANTED == 'true'
        shell: bash
        run: cat "$RUNNER_TEMP/pdfium-build/staging/VERSION" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: env.WANTED == 'true'
        with:
          name: pdfium-${{ matrix.os }}${{ matrix.env && format('-{0}', matrix.env) || '' }}-${{ matrix.cpu }}
          path: ${{ runner.temp }}/pdfium-build/pdfium-${{ matrix.os }}${{ matrix.env && format('-{0}', matrix.env) || '' }}-${{ matrix.cpu }}.tgz
          if-no-files-found: error

  mac-univ:
    name: mac universal
    needs: build
    # Only the two mac archives matter here; another target failing must not skip it.
    if: ${{ !cancelled() && (inputs.targets == 'all' || (contains(inputs.targets, 'mac-arm64') && contains(inputs.targets, 'mac-x64'))) }}
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pdfium-mac-*
          merge-multiple: true
      - name: lipo arm64 + x64
        run: |
          mkdir arm64 x64 univ
          tar xzf pdfium-mac-arm64.tgz -C arm64
          tar xzf pdfium-mac-x64.tgz -C x64
          cp -R arm64/. univ/
          sed -i '' '/target_cpu/d' univ/args.gn
          lipo -create arm64/lib/libpdfium.dylib x64/lib/libpdfium.dylib -output univ/lib/libpdfium.dylib
          lipo -info univ/lib/libpdfium.dylib
          (cd univ && tar czf ../pdfium-mac-univ.tgz -- *)
      - uses: actions/upload-artifact@v4
        with:
          name: pdfium-mac-univ
          path: pdfium-mac-univ.tgz
          if-no-files-found: error

  release:
    name: publish
    if: inputs.release && inputs.attach_to == ''
    needs: [build, mac-univ]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pdfium-*
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir v && tar xzf pdfium-linux-x64.tgz -C v VERSION
          BUILD=$(sed -n 's/^BUILD=//p' v/VERSION)
          SERIES=$(sed -n 's/^MEGAPDF_SERIES=//p' v/VERSION)
          PATCHES=$(sed -n 's/^MEGAPDF_PATCHES=//p' v/VERSION)
          TAG="pdfium-$BUILD-megapdf-$SERIES"
          gh release create "$TAG" pdfium-*.tgz \
            --title "PDFium $BUILD + MegaPDF patches ($PATCHES, series $SERIES)" \
            --notes "PDFium chromium/$BUILD built with bblanchon/pdfium-binaries and MegaPDF's content-writer patch series (tools/pdfium/patches at $GITHUB_SHA). See #119." \
            --prerelease

  # Adds archives to a release that already exists, for a target the series was not
  # first built for (#288: win-arm64 joined 71de3e7cee0e after it was published). The
  # series is the release's identity, so an archive whose VERSION differs from the one
  # the release already carries is refused, and nothing already there is replaced.
  attach:
    name: attach to ${{ inputs.attach_to }}
    if: inputs.attach_to != ''
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pdfium-*
          merge-multiple: true
      - name: Check the series, then upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.attach_to }}
        run: |
          set -euo pipefail
          ls pdfium-*.tgz >/dev/null
          existing=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          mkdir ref && gh release download "$TAG" -p pdfium-linux-x64.tgz -D ref
          tar xzf ref/pdfium-linux-x64.tgz -C ref VERSION
          echo "the release carries:"; cat ref/VERSION
          for a in pdfium-*.tgz; do
            if grep -qxF "$a" <<<"$existing"; then
              echo "::error::$TAG already has $a; attaching never replaces an asset"; exit 1
            fi
            mkdir -p "v/$a" && tar xzf "$a" -C "v/$a" VERSION
            if ! diff -u ref/VERSION "v/$a/VERSION"; then
              echo "::error::$a is not the series $TAG was built from"; exit 1
            fi
          done
          gh release upload "$TAG" pdfium-*.tgz
          gh release view "$TAG" --json assets --jq '.assets[].name'
