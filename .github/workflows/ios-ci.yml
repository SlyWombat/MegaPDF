name: iOS CI

# Development is Mac-less: this runner is the build machine (#20). Since #614 the
# `build` job prefers our own Mac mini over GitHub's hosted macOS when a repository
# variable says so and the pull request is not from a fork — see the long comment on
# `runs-on` below, and tools/mac-mini.md for the two commands that turn it on and off.
on:
  # Development is Mac-less, so this is the only way to compile-check an iOS change
  # without opening a PR.
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['ios/**', 'core/**', 'libs/pdfium/**', 'tools/gen_test_fixtures.py', '.github/workflows/ios-ci.yml']
  pull_request:
    branches: [main]
    paths: ['ios/**', 'core/**', 'libs/pdfium/**', 'tools/gen_test_fixtures.py', '.github/workflows/ios-ci.yml']

jobs:
  build:
    # Our own Mac mini when it is switched on and the pull request is ours;
    # GitHub's hosted macOS otherwise (#614). Read this right to left:
    #
    #   vars.MAC_SELF_HOSTED == 'on'      the switch. A repository variable, not a
    #                                     setting on the machine, so Dave can turn the
    #                                     Mac out of the loop from anywhere and the
    #                                     queued jobs go back to GitHub instead of
    #                                     waiting 24 hours for a runner that is off.
    #                                     Unset means hosted, so this file changes
    #                                     nothing until the variable is set.
    #   head.repo.full_name == repository THE fork guard, and the reason any of this is
    #                                     safe. THIS REPOSITORY IS PUBLIC. A self-hosted
    #                                     runner executes whatever a workflow tells it
    #                                     to, as the account it runs under, so a pull
    #                                     request opened from a fork must never reach
    #                                     our hardware. It still gets checked — on
    #                                     GitHub's disposable runner, which is what that
    #                                     is for. There are no forks today; that is the
    #                                     moment to put this in, not afterwards.
    #                                     The repository's fork-PR approval policy is
    #                                     only "first_time_contributors", so the guard
    #                                     cannot live in a setting.
    #   event_name != 'pull_request'      a push to main, or a workflow_dispatch: the
    #                                     code is already in the repository, so there is
    #                                     no untrusted author to guard against.
    #
    # Verified rather than assumed: .github/workflows/runner-selection-probe.yml
    # evaluated this expression and three held-constant variants on a hosted runner in
    # both event shapes. The one that matters is a pull_request whose head repository is
    # not this one with the switch forced on: it resolves to macos-latest. Recorded on
    # #614.
    runs-on: ${{ fromJSON((vars.MAC_SELF_HOSTED == 'on' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && '["self-hosted","macOS","ARM64","megapdf-ios"]' || '["macos-latest"]') }}
    defaults:
      run:
        working-directory: ios
    steps:
      # A hosted runner is a fresh machine every time and ours is a desktop. #569 was a
      # flake caused entirely by state surviving between runs on a machine that was not
      # clean, so everything a job could inherit is removed here rather than hoped about:
      # the whole workspace (ios/Vendor is gitignored and scripts/fetch-pdfium.sh SKIPS
      # the fetch when the folder is already there, which on this machine means a
      # fortnight-old xcframework — see tools/mac-mini.md), and any simulator left behind
      # by a cancelled job of ours. Derived data goes under RUNNER_TEMP further down for
      # the same reason.
      #
      # Only devices named megapdf-ci-* are touched. The Mac mini is shared with people
      # and agents who have their own simulators booted, and deleting one of those would
      # break a run in flight.
      - name: Start from nothing (self-hosted only)
        if: runner.environment == 'self-hosted'
        working-directory: ${{ github.workspace }}
        run: |
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          ls -A "$GITHUB_WORKSPACE" || true
          /usr/bin/xcrun simctl list devices -j \
            | python3 -c "import json,sys;[print(d['udid']) for ds in json.load(sys.stdin)['devices'].values() for d in ds if d['name'].startswith('megapdf-ci-')]" \
            | while read -r u; do echo "deleting leftover simulator $u"; /usr/bin/xcrun simctl delete "$u" || true; done

      - uses: actions/checkout@v4

      - name: Cache PDFium xcframework
        uses: actions/cache@v4
        with:
          path: ios/Vendor
          key: pdfium-ios-${{ hashFiles('libs/pdfium/RELEASE') }}-v5

      - name: Fetch PDFium and assemble xcframework
        run: bash scripts/fetch-pdfium.sh

      - name: Install XcodeGen
        # Already installed on the Mac mini, and `brew install` on an installed
        # formula is a slow no-op that can decide to update Homebrew first.
        run: command -v xcodegen >/dev/null || brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Two simulators are CREATED for this job and deleted again when it ends, rather
      # than a long-lived device being picked by name. On a hosted runner that is a
      # formality; on ours it is the difference between a reproducible verdict and
      # inheriting whatever the last nineteen days left in a device's data container.
      # Doing it the same way on both runners is the point: the machine stops being
      # the variable.
      #
      # #465: the zoom test runs on one of each width class. A compact-width iPhone has
      # a bottom toolbar exactly where a synthesised pinch puts its lower finger; a
      # regular-width iPad has its tools along the top instead. That difference made the
      # same test pass on one and measure a no-op on the other for a fortnight, so both
      # are run. Which models exist is left to whatever the Xcode install offers, as
      # before — only the devices themselves are now ours.
      - name: Create a simulator of our own for this job
        run: |
          python3 - "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" <<'PY' >> "$GITHUB_ENV"
          import json, subprocess, sys
          tag = sys.argv[1]
          cat = json.loads(subprocess.run(
              ['xcrun', 'simctl', 'list', 'devices', 'available', '-j'],
              capture_output=True, text=True, check=True).stdout)['devices']
          def pick(prefix):
              for runtime, devices in cat.items():
                  for d in devices:
                      if d['name'].startswith(prefix):
                          return d['deviceTypeIdentifier'], runtime, d['name']
              sys.exit(f'no available {prefix} simulator in this Xcode')
          for prefix, var in (('iPhone', 'SIM'), ('iPad', 'IPAD')):
              dtype, runtime, model = pick(prefix)
              name = f'megapdf-ci-{var.lower()}-{tag}'
              udid = subprocess.run(['xcrun', 'simctl', 'create', name, dtype, runtime],
                                    capture_output=True, text=True, check=True).stdout.strip()
              print(f'{var}_UDID={udid}')
              print(f'{var}_MODEL={model}')
              print(f'created {name}: {model} on {runtime} -> {udid}', file=sys.stderr)
          PY
          # Derived data per job, under a directory the runner wipes between jobs. The
          # default is ~/Library/Developer/Xcode/DerivedData, which on a desktop is
          # shared with every other build on the machine.
          echo "DD=$RUNNER_TEMP/dd" >> "$GITHUB_ENV"

      - name: Which simulators this job is using
        run: |
          echo "iPhone: $SIM_MODEL  ($SIM_UDID)"
          echo "iPad:   $IPAD_MODEL ($IPAD_UDID)"

      - name: Build and test (simulator, unsigned)
        run: |
          xcodebuild test \
            -project MegaPDF.xcodeproj \
            -scheme MegaPDF \
            -destination "id=$SIM_UDID" \
            -derivedDataPath "$DD" \
            CODE_SIGNING_ALLOWED=NO

      # The same suite under the French (Canada) localisation (#91). No test
      # asserts UI text, so this proves the fr-CA catalog compiles and the app
      # launches with it — a broken .xcstrings fails here rather than in review.
      - name: Test again in French (Canada)
        run: |
          xcodebuild test-without-building \
            -project MegaPDF.xcodeproj \
            -scheme MegaPDF \
            -destination "id=$SIM_UDID" \
            -derivedDataPath "$DD" \
            -testLanguage fr -testRegion CA \
            CODE_SIGNING_ALLOWED=NO

      # The UI tests that drive the built app on the simulator (#405): pinch zoom,
      # body-text editing, Markdown export, Save a copy, the recents rows' labels,
      # the viewer bar's contrast and the redaction save question.
      #
      # #589 is why Save a copy is in this list. It was broken on every document on
      # `main` — two `.fileExporter` modifiers on one view, and the PDF one never
      # presented — while every job here stayed green, because the only suite that
      # drove the real export sheet for it (FilesEndToEndUITests) is excluded below
      # and the unit tests call `finishExport` directly, with no sheet involved.
      # SaveACopyExportUITests presents the real system sheet off bytes in the launch
      # environment, so it needs none of the staged Files fixtures that keep the
      # end-to-end suite off a runner, and it fails if the sheet does not appear.
      #
      # Measured on the runner (2026-09-27, before #589's two tests, which add about
      # 50 s on the Mac mini): about 20 s to build the test bundle, 3-4 minutes to
      # boot the simulator, and 6-7 minutes of tests — three to four times what the
      # same tests take on the Mac mini (2.5 minutes); about 10 minutes on the
      # job in all.
      #
      # Kept out on purpose: DemoFlowUITests is the preview-video choreography
      # (timed for a recording, not a verdict); CaptureSimulatorSetupUITests
      # changes the simulator's Settings for the screenshot rig;
      # FilesEndToEndUITests needs a 1 GB fixture and the real Files picker
      # (tools/ios-files-e2e.sh); ShareVerificationUITests and
      # OpenWithVerificationUITests go through the Files app, which on a runner
      # did not open the staged file at all (two runs, two different failures)
      # and on the Mac mini does not list MegaPDF in its share sheet;
      # RecentsAccessibilityUITests' long-press test passed one runner run and
      # failed the next ("the context menu has no Remove from Recents"); and
      # RedactionUITests' menu test fails on the simulator today ("the ⋯ menu
      # has no Redact row" — its first run on a device, 2026-09-27).
      - name: Build the UI tests
        run: |
          xcodebuild build-for-testing \
            -project MegaPDF.xcodeproj \
            -scheme MegaPDFDemo \
            -destination "id=$SIM_UDID" \
            -derivedDataPath "$DD" \
            CODE_SIGNING_ALLOWED=NO

      # Booted here rather than by xcodebuild, so the boot is its own timing and
      # the keyboard flag can be written first: the first keyboard on a fresh
      # simulator comes up under iOS's QuickPath tip, and the flag is what a
      # first keyboard would have left (#406).
      - name: Boot the simulator
        run: |
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b
          xcrun simctl spawn "$SIM_UDID" defaults write com.apple.keyboard.preferences \
            DidShowContinuousPathIntroduction -bool true

      - name: Run the UI tests
        run: |
          xcodebuild test-without-building \
            -project MegaPDF.xcodeproj \
            -scheme MegaPDFDemo \
            -destination "id=$SIM_UDID" \
            -derivedDataPath "$DD" \
            -resultBundlePath "$RUNNER_TEMP/ui-tests.xcresult" \
            -only-testing:MegaPDFUITests/ViewerZoomUITests \
            -only-testing:MegaPDFUITests/ReadingModeUITests \
            -only-testing:MegaPDFUITests/PageToolsUITests \
            -only-testing:MegaPDFUITests/BodyTextEditUITests \
            -only-testing:MegaPDFUITests/MarkdownExportUITests \
            -only-testing:MegaPDFUITests/SaveACopyExportUITests \
            -only-testing:MegaPDFUITests/RecentsAccessibilityUITests/testEveryRecentRowAnnouncesWhereItsFileLives \
            -only-testing:MegaPDFUITests/ViewerBarContrastUITests \
            -only-testing:MegaPDFUITests/RedactionUITests/testSaveIsReachableWithAMarkAndAsksBeforeRemoving \
            CODE_SIGNING_ALLOWED=NO

      # The regular-width half of the zoom check (#465) and of reading mode (#506). No
      # second build: an iOS Simulator build-for-testing is keyed to the platform, not to
      # the device, so the products above run against an iPad destination unchanged.
      # Reading mode is here as well as on the iPhone because the two layouts differ in
      # exactly the chrome it hides -- the iPad's tools are a strip of its own (#172) and
      # carry reading mode's second entry point, where compact width has only the bottom
      # bar and the dot-dot-dot menu. The page tools (#174) are here for a stronger version
      # of the same reason: the two widths get genuinely different answers -- a sheet with
      # detents on the phone, a sidebar beside the document on the iPad -- and each of those
      # tests skips on the other width, so neither destination alone runs the whole suite.
      # Save a copy is here because #589 was reported on both widths, the ⋯ menu it is
      # tapped from is a different control on each, and in regular width the pages sidebar
      # puts a second file exporter in the same hierarchy as the viewer's own.
      - name: Run the zoom, reading-mode, page-tools and Save-a-copy tests on an iPad too
        run: |
          xcodebuild test-without-building \
            -project MegaPDF.xcodeproj \
            -scheme MegaPDFDemo \
            -destination "id=$IPAD_UDID" \
            -derivedDataPath "$DD" \
            -resultBundlePath "$RUNNER_TEMP/ui-tests-ipad.xcresult" \
            -only-testing:MegaPDFUITests/ViewerZoomUITests \
            -only-testing:MegaPDFUITests/ReadingModeUITests \
            -only-testing:MegaPDFUITests/PageToolsUITests \
            -only-testing:MegaPDFUITests/SaveACopyExportUITests \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload the UI test result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-tests-xcresult
          path: ${{ runner.temp }}/ui-tests.xcresult

      - name: Upload the iPad UI test result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-tests-ipad-xcresult
          path: ${{ runner.temp }}/ui-tests-ipad.xcresult

      # Always, including after a cancellation, and only the two devices this job
      # created — their UDIDs, not a name pattern, so there is no way for this to
      # reach a simulator belonging to somebody else on the machine. On a hosted
      # runner it is wasted breath; on ours it is what stops #569 happening again
      # in iOS form.
      - name: Give the simulators back
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          for u in "$SIM_UDID" "$IPAD_UDID"; do
            [ -n "${u:-}" ] || continue
            xcrun simctl shutdown "$u" 2>/dev/null || true
            xcrun simctl delete "$u" 2>/dev/null || true
            echo "deleted $u"
          done

  # ADR-001 evidence: PDFKit vs the MegaPDF_Id interop contract (macOS PDFKit
  # is the same framework family as iOS). Read the SPIKE: lines in the log.
  #
  # Deliberately left on GitHub's macOS (#614): it is a one-file `swift` run of
  # about a minute, so it gains nothing from our hardware, and keeping one macOS
  # job hosted means the hosted path stays exercised on every pull request
  # instead of rotting until the day the Mac mini is unavailable.
  pdfkit-spike:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate fixtures
        run: python3 tools/gen_test_fixtures.py "$RUNNER_TEMP/fixtures"

      - name: Run PDFKit spike
        run: swift ios/spike/PdfKitSpike.swift "$RUNNER_TEMP/fixtures/stamped.pdf"
