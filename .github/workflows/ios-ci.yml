name: iOS CI

# Development is Mac-less: this runner is the build machine (#20).
on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios-ci.yml']
  pull_request:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios-ci.yml']

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (simulator, unsigned)
        run: |
          xcodebuild build \
            -project MegaPDF.xcodeproj \
            -target MegaPDF \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
