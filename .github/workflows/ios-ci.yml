name: iOS CI

# Development is Mac-less: this runner is the build machine (#20).
on:
  # Development is Mac-less, so this is the only way to compile-check an iOS change
  # without opening a PR.
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['ios/**', 'core/**', 'libs/pdfium/**', 'tools/gen_test_fixtures.py', '.github/workflows/ios-ci.yml']
  pull_request:
    branches: [main]
    paths: ['ios/**', 'core/**', 'libs/pdfium/**', 'tools/gen_test_fixtures.py', '.github/workflows/ios-ci.yml']

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Cache PDFium xcframework
        uses: actions/cache@v4
        with:
          path: ios/Vendor
          key: pdfium-ios-${{ hashFiles('libs/pdfium/RELEASE') }}-v5

      - name: Fetch PDFium and assemble xcframework
        run: bash scripts/fetch-pdfium.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick a simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(dev['name'] for devs in d.values() for dev in devs if dev['name'].startswith('iPhone')))")
          echo "SIM_DEVICE=$DEVICE" >> "$GITHUB_ENV"
          echo "using simulator: $DEVICE"
          # #465: the zoom test runs on one of each width class. A compact-width
          # iPhone has a bottom toolbar exactly where a synthesised pinch puts its
          # lower finger; a regular-width iPad has its tools along the top instead.
          # That difference made the same test pass on one and measure a no-op on
          # the other for a fortnight, so both are run.
          IPAD=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(dev['name'] for devs in d.values() for dev in devs if dev['name'].startswith('iPad')))")
          echo "IPAD_DEVICE=$IPAD" >> "$GITHUB_ENV"
          echo "using iPad simulator: $IPAD"

      - name: Build and test (simulator, unsigned)
        run: |
          xcodebuild test \
            -project MegaPDF.xcodeproj \
            -scheme MegaPDF \
            -destination "platform=iOS Simulator,name=$SIM_DEVICE" \
            CODE_SIGNING_ALLOWED=NO

      # The same suite under the French (Canada) localisation (#91). No test
      # asserts UI text, so this proves the fr-CA catalog compiles and the app
      # launches with it — a broken .xcstrings fails here rather than in review.
      - name: Test again in French (Canada)
        run: |
          xcodebuild test-without-building \
            -project MegaPDF.xcodeproj \
            -scheme MegaPDF \
            -destination "platform=iOS Simulator,name=$SIM_DEVICE" \
            -testLanguage fr -testRegion CA \
            CODE_SIGNING_ALLOWED=NO

      # The UI tests that drive the built app on the simulator (#405): pinch zoom,
      # body-text editing, Markdown export, the recents rows' labels, the viewer
      # bar's contrast and the redaction save question. Measured on the runner
      # (2026-09-27): about 20 s to build the test bundle, 3-4 minutes to boot
      # the simulator, and 6-7 minutes of tests — three to four times what the
      # same tests take on the Mac mini (2.5 minutes); about 10 minutes on the
      # job in all.
      #
      # Kept out on purpose: DemoFlowUITests is the preview-video choreography
      # (timed for a recording, not a verdict); CaptureSimulatorSetupUITests
      # changes the simulator's Settings for the screenshot rig;
      # FilesEndToEndUITests needs a 1 GB fixture and the real Files picker
      # (tools/ios-files-e2e.sh); ShareVerificationUITests and
      # OpenWithVerificationUITests go through the Files app, which on a runner
      # did not open the staged file at all (two runs, two different failures)
      # and on the Mac mini does not list MegaPDF in its share sheet;
      # RecentsAccessibilityUITests' long-press test passed one runner run and
      # failed the next ("the context menu has no Remove from Recents"); and
      # RedactionUITests' menu test fails on the simulator today ("the ⋯ menu
      # has no Redact row" — its first run on a device, 2026-09-27).
      - name: Build the UI tests
        run: |
          xcodebuild build-for-testing \
            -project MegaPDF.xcodeproj \
            -scheme MegaPDFDemo \
            -destination "platform=iOS Simulator,name=$SIM_DEVICE" \
            CODE_SIGNING_ALLOWED=NO

      # Booted here rather than by xcodebuild, so the boot is its own timing and
      # the keyboard flag can be written first: the first keyboard on a fresh
      # simulator comes up under iOS's QuickPath tip, and the flag is what a
      # first keyboard would have left (#406).
      - name: Boot the simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(dev['udid'] for devs in d.values() for dev in devs if dev['name'] == '$SIM_DEVICE'))")
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl spawn "$UDID" defaults write com.apple.keyboard.preferences \
            DidShowContinuousPathIntroduction -bool true

      - name: Run the UI tests
        run: |
          xcodebuild test-without-building \
            -project MegaPDF.xcodeproj \
            -scheme MegaPDFDemo \
            -destination "id=$SIM_UDID" \
            -resultBundlePath "$RUNNER_TEMP/ui-tests.xcresult" \
            -only-testing:MegaPDFUITests/ViewerZoomUITests \
            -only-testing:MegaPDFUITests/ReadingModeUITests \
            -only-testing:MegaPDFUITests/BodyTextEditUITests \
            -only-testing:MegaPDFUITests/MarkdownExportUITests \
            -only-testing:MegaPDFUITests/RecentsAccessibilityUITests/testEveryRecentRowAnnouncesWhereItsFileLives \
            -only-testing:MegaPDFUITests/ViewerBarContrastUITests \
            -only-testing:MegaPDFUITests/RedactionUITests/testSaveIsReachableWithAMarkAndAsksBeforeRemoving \
            CODE_SIGNING_ALLOWED=NO

      # The regular-width half of the zoom check (#465) and of reading mode (#506). No
      # second build: an iOS Simulator build-for-testing is keyed to the platform, not to
      # the device, so the products above run against an iPad destination unchanged.
      # Reading mode is here as well as on the iPhone because the two layouts differ in
      # exactly the chrome it hides -- the iPad's tools are a strip of its own (#172) and
      # carry reading mode's second entry point, where compact width has only the bottom
      # bar and the dot-dot-dot menu.
      - name: Run the zoom and reading-mode tests on an iPad too
        run: |
          xcodebuild test-without-building \
            -project MegaPDF.xcodeproj \
            -scheme MegaPDFDemo \
            -destination "platform=iOS Simulator,name=$IPAD_DEVICE" \
            -resultBundlePath "$RUNNER_TEMP/ui-tests-ipad.xcresult" \
            -only-testing:MegaPDFUITests/ViewerZoomUITests \
            -only-testing:MegaPDFUITests/ReadingModeUITests \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload the UI test result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-tests-xcresult
          path: ${{ runner.temp }}/ui-tests.xcresult

      - name: Upload the iPad UI test result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-tests-ipad-xcresult
          path: ${{ runner.temp }}/ui-tests-ipad.xcresult

  # ADR-001 evidence: PDFKit vs the MegaPDF_Id interop contract (macOS PDFKit
  # is the same framework family as iOS). Read the SPIKE: lines in the log.
  pdfkit-spike:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate fixtures
        run: python3 tools/gen_test_fixtures.py "$RUNNER_TEMP/fixtures"

      - name: Run PDFKit spike
        run: swift ios/spike/PdfKitSpike.swift "$RUNNER_TEMP/fixtures/stamped.pdf"
