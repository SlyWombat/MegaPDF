name: iOS CI

# Development is Mac-less: this runner is the build machine (#20).
on:
  # Development is Mac-less, so this is the only way to compile-check an iOS change
  # without opening a PR.
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['ios/**', 'core/**', 'libs/pdfium/**', 'tools/gen_test_fixtures.py', '.github/workflows/ios-ci.yml']
  pull_request:
    branches: [main]
    paths: ['ios/**', 'core/**', 'libs/pdfium/**', 'tools/gen_test_fixtures.py', '.github/workflows/ios-ci.yml']

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Cache PDFium xcframework
        uses: actions/cache@v4
        with:
          path: ios/Vendor
          key: pdfium-ios-${{ hashFiles('libs/pdfium/RELEASE') }}-v5

      - name: Fetch PDFium and assemble xcframework
        run: bash scripts/fetch-pdfium.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick a simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(dev['name'] for devs in d.values() for dev in devs if dev['name'].startswith('iPhone')))")
          echo "SIM_DEVICE=$DEVICE" >> "$GITHUB_ENV"
          echo "using simulator: $DEVICE"

      - name: Build and test (simulator, unsigned)
        run: |
          xcodebuild test \
            -project MegaPDF.xcodeproj \
            -scheme MegaPDF \
            -destination "platform=iOS Simulator,name=$SIM_DEVICE" \
            CODE_SIGNING_ALLOWED=NO

      # The same suite under the French (Canada) localisation (#91). No test
      # asserts UI text, so this proves the fr-CA catalog compiles and the app
      # launches with it — a broken .xcstrings fails here rather than in review.
      - name: Test again in French (Canada)
        run: |
          xcodebuild test-without-building \
            -project MegaPDF.xcodeproj \
            -scheme MegaPDF \
            -destination "platform=iOS Simulator,name=$SIM_DEVICE" \
            -testLanguage fr -testRegion CA \
            CODE_SIGNING_ALLOWED=NO

      # The UI tests that drive the built app on the simulator (#405): pinch zoom,
      # body-text editing, Markdown export, the recents rows, the viewer bar's
      # contrast, the redaction save question and the Share sheet. Measured on
      # the Mac mini: about 2.5 minutes of tests on a booted simulator; the
      # build-for-testing on top of the build above is incremental.
      #
      # Kept out on purpose: DemoFlowUITests is the preview-video choreography
      # (timed for a recording, not a verdict); CaptureSimulatorSetupUITests
      # changes the simulator's Settings for the screenshot rig;
      # FilesEndToEndUITests needs a 1 GB fixture and the real Files picker
      # (tools/ios-files-e2e.sh); OpenWithVerificationUITests reads the Files
      # app's share sheet, which on the Mac mini's simulator does not list
      # MegaPDF; and RedactionUITests' menu test fails on the simulator today
      # ("the ⋯ menu has no Redact row" — its first run on a device, 2026-09-27).
      - name: Build the UI tests
        run: |
          xcodebuild build-for-testing \
            -project MegaPDF.xcodeproj \
            -scheme MegaPDFDemo \
            -destination "platform=iOS Simulator,name=$SIM_DEVICE" \
            CODE_SIGNING_ALLOWED=NO

      # ShareVerificationUITests opens a PDF staged in the simulator's own "On My
      # iPhone" — the local File Provider storage, which is the one of the three
      # folders by that name whose container is the LocalStorage app group, and
      # which exists only once Files has run (tools/ios-files-e2e.sh has the same
      # recipe). The first keyboard on a fresh simulator comes up under iOS's
      # QuickPath tip; the flag is what a first keyboard would have left (#406).
      - name: Boot the simulator and stage the Share fixture
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(dev['udid'] for devs in d.values() for dev in devs if dev['name'] == '$SIM_DEVICE'))")
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl spawn "$UDID" defaults write com.apple.keyboard.preferences \
            DidShowContinuousPathIntroduction -bool true
          local_storage() {
            local g
            for g in "$HOME/Library/Developer/CoreSimulator/Devices/$UDID/data/Containers/Shared/AppGroup"/*/; do
              if [ "$(plutil -extract MCMMetadataIdentifier raw "$g.com.apple.mobile_container_manager.metadata.plist" 2>/dev/null)" \
                   = group.com.apple.FileProvider.LocalStorage ]; then
                echo "${g}File Provider Storage"; return
              fi
            done
          }
          STORE=$(local_storage)
          if [ -z "$STORE" ] || [ ! -d "$STORE" ]; then
            xcrun simctl launch "$UDID" com.apple.DocumentsApp >/dev/null 2>&1 || true
            sleep 8
            xcrun simctl terminate "$UDID" com.apple.DocumentsApp >/dev/null 2>&1 || true
            STORE=$(local_storage)
          fi
          [ -n "$STORE" ] && [ -d "$STORE" ] || { echo "::error::no On My iPhone storage on $SIM_DEVICE"; exit 1; }
          python3 - "$STORE" <<'PY'
          import os, sys
          sys.path.insert(0, os.path.join(os.environ["GITHUB_WORKSPACE"], "tools"))
          from gen_redaction_fixtures import _one_page
          page = _one_page(b"BT /F1 20 Tf 72 700 Td (MegaPDF share check) Tj ET\n")
          open(os.path.join(sys.argv[1], "share-check.pdf"), "wb").write(page)
          PY
          ls -la "$STORE"

      - name: Run the UI tests
        env:
          TEST_RUNNER_SHARE_CHECK: "1"
        run: |
          xcodebuild test-without-building \
            -project MegaPDF.xcodeproj \
            -scheme MegaPDFDemo \
            -destination "id=$SIM_UDID" \
            -resultBundlePath "$RUNNER_TEMP/ui-tests.xcresult" \
            -only-testing:MegaPDFUITests/ViewerZoomUITests \
            -only-testing:MegaPDFUITests/BodyTextEditUITests \
            -only-testing:MegaPDFUITests/MarkdownExportUITests \
            -only-testing:MegaPDFUITests/RecentsAccessibilityUITests \
            -only-testing:MegaPDFUITests/ViewerBarContrastUITests \
            -only-testing:MegaPDFUITests/RedactionUITests/testSaveIsReachableWithAMarkAndAsksBeforeRemoving \
            -only-testing:MegaPDFUITests/ShareVerificationUITests \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload the UI test result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-tests-xcresult
          path: ${{ runner.temp }}/ui-tests.xcresult

  # ADR-001 evidence: PDFKit vs the MegaPDF_Id interop contract (macOS PDFKit
  # is the same framework family as iOS). Read the SPIKE: lines in the log.
  pdfkit-spike:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate fixtures
        run: python3 tools/gen_test_fixtures.py "$RUNNER_TEMP/fixtures"

      - name: Run PDFKit spike
        run: swift ios/spike/PdfKitSpike.swift "$RUNNER_TEMP/fixtures/stamped.pdf"
