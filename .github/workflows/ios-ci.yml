name: iOS CI

# Development is Mac-less: this runner is the build machine (#20).
on:
  push:
    branches: [main]
    paths: ['ios/**', 'tools/gen_test_fixtures.py', '.github/workflows/ios-ci.yml']
  pull_request:
    branches: [main]
    paths: ['ios/**', 'tools/gen_test_fixtures.py', '.github/workflows/ios-ci.yml']

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (simulator, unsigned)
        run: |
          xcodebuild build \
            -project MegaPDF.xcodeproj \
            -target MegaPDF \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

  # ADR-001 evidence: PDFKit vs the MegaPDF_Id interop contract (macOS PDFKit
  # is the same framework family as iOS). Read the SPIKE: lines in the log.
  pdfkit-spike:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate fixtures
        run: python3 tools/gen_test_fixtures.py "$RUNNER_TEMP/fixtures"

      - name: Run PDFKit spike
        run: swift ios/spike/PdfKitSpike.swift "$RUNNER_TEMP/fixtures/stamped.pdf"
