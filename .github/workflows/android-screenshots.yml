name: Android Screenshots

# Manual: captures Play Store phone screenshots from an emulator using the
# app's `--es screenshot <state>` launch extra (home / viewer / sign / draw).
# Download the artifact; tools/play_submit.py-style API upload puts them on
# the listing.
on:
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_6
          working-directory: android
          script: bash scripts/capture-screenshots.sh

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: play-screenshots
          path: /tmp/shots/
