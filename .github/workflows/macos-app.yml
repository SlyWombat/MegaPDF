# Builds the macOS app (ADR-002 Option B: Avalonia over MegaPDF.Core) and
# publishes a runnable .app as a workflow artifact.
#
# The bundles are AD-HOC SIGNED ONLY — runnable by someone who trusts them, not
# distributable. Developer ID signing and notarytool stapling are ADR-002 §7.
# To open one on a Mac the first time: right-click the app and choose Open, or
# `xattr -dr com.apple.quarantine MegaPDF.app`.
name: macOS app

on:
  workflow_dispatch:
  # macos-cli-v* (#142, #356): the megapdf-cli release archive, built and notarized by
  # the cli-release job below. Not macos-v*: there is no tag-triggered release of the
  # app bundle itself (ADR-002 decided Mac App Store; macos-appstore.yml is
  # workflow_dispatch-only, on purpose — see its own header), so a bare macos-v* tag
  # would look like it releases the app and would not. This tag releases the CLI only.
  push:
    tags: ['macos-cli-v*']
  pull_request:
    paths:
      - '.github/workflows/macos-app.yml'
      - 'tools/build-macos-app.sh'
      - 'tools/fetch-pdfium-mac.sh'
      - 'tools/notarize-macos-app.sh'
      - 'libs/pdfium/RELEASE'
      - 'src/MegaPDF.Avalonia/**'
      # Core is shared with the Windows app, so a Core change that breaks the Mac
      # build has to surface here rather than at release time. This is the one
      # path that makes the job fire on unrelated PRs; it is deliberate.
      - 'src/MegaPDF.Core/**'
      # The shared engine core is compiled into the Mac bundle as
      # libmegapdf_core.dylib (#38, ADR-003); a change there is a Mac change.
      - 'core/**'
      - 'tools/build-core.sh'

permissions:
  contents: read

jobs:
  # Fast feedback on the same code, on the cheaper runner. This is ADR-002
  # criterion 3 in CI form: the Avalonia UI builds and runs on Windows, so the
  # daily loop never needs a Mac.
  windows-build:
    name: Build on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      # A shell script committed without its executable bit fails with "Permission
      # denied" only on the runner that uses it — which for the release scripts
      # means at the worst possible moment. This has now bitten twice; it is
      # cheaper to check than to remember.
      - name: Scripts are executable
        shell: bash
        run: |
          bad=$(git ls-files -s tools/*.sh | grep -v '^100755' || true)
          if [ -n "$bad" ]; then
            echo "::error::these scripts are committed without the executable bit:"
            echo "$bad"
            echo "fix with: git update-index --chmod=+x <path>"
            exit 1
          fi
          echo "all tools/*.sh are executable"

      - name: Build
        run: dotnet build src/MegaPDF.Avalonia/MegaPDF.Avalonia.csproj -c Release
      - name: Core tests still green on Windows
        run: |
          dotnet test tests/MegaPDF.Core.Tests/MegaPDF.Core.Tests.csproj -c Release `
            --logger "console;verbosity=minimal"

      # The same end-to-end check the macOS bundle runs. Clicking is the one thing
      # CI cannot do, so this drives the real view model's click routing and then
      # verifies through a fresh engine open of the saved file. Running it on both
      # desktops is what makes "parity" a claim with evidence behind it.
      - name: Fill-check-sign self-test
        shell: bash
        run: |
          python3 tools/gen_test_fixtures.py "$RUNNER_TEMP/fixtures"
          # The #173 redaction fixtures land in the same directory; the names do not clash.
          python3 tools/gen_redaction_fixtures.py "$RUNNER_TEMP/fixtures"
          dotnet run --project src/MegaPDF.Avalonia/MegaPDF.Avalonia.csproj -c Release --no-build -- \
            --self-test "$RUNNER_TEMP/fixtures"

  macos-app:
    name: MegaPDF.app (${{ matrix.rid }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-arm64, osx-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Fetches pdfium into libs/pdfium/mac-univ (where MegaPDF.Core.csproj looks)
      # and fails if the slice is not the pinned build.
      - name: Build MegaPDF.app
        run: tools/build-macos-app.sh ${{ matrix.rid }} "$RUNNER_TEMP/app"

      # Two smoke tests, because they prove different things and only one of them
      # is obvious.
      #
      # --render-check returns before Avalonia is ever initialised, so it proves
      # Core and libpdfium.dylib load inside the bundle and nothing more.
      - name: Engine loads inside the bundle
        run: |
          python3 tools/gen_test_fixtures.py "$RUNNER_TEMP/fixtures"
          # The #173 redaction fixtures land in the same directory; the names do not clash.
          python3 tools/gen_redaction_fixtures.py "$RUNNER_TEMP/fixtures"
          "$RUNNER_TEMP/app/MegaPDF.app/Contents/MacOS/MegaPDF" --render-check \
            "$RUNNER_TEMP/fixtures/stamped.pdf"

      # The UI has to be started for real. PublishSingleFile changed how the
      # runtime resolves native libraries, and libAvaloniaNative/libSkiaSharp/
      # libHarfBuzzSharp now sit outside the apphost — a combination no spike
      # ever exercised. Without this step a bundle whose window cannot open
      # would ship having passed every check.
      # Editing, verified inside the shipped bundle: tick a checkbox, save, reopen,
      # undo. "The app launches" says nothing about whether ticking a box works.
      - name: Fill-check-sign self-test (in the bundle)
        run: |
          "$RUNNER_TEMP/app/MegaPDF.app/Contents/MacOS/MegaPDF" --self-test "$RUNNER_TEMP/fixtures"

      # A hand-rolled ICNS that PIL wrote and PIL reads back is not evidence
      # macOS accepts it. iconutil is macOS's own reader: if it can explode the
      # container into an iconset, Finder and the Dock can read it too. The
      # bundle showed the blank generic document before this (#73), so the check
      # also asserts the plist key that points at it.
      - name: The app has an icon macOS can read
        run: |
          APP="$RUNNER_TEMP/app/MegaPDF.app"
          ICNS="$APP/Contents/Resources/MegaPDF.icns"

          test -f "$ICNS" || { echo "::error::no $ICNS in the bundle"; exit 1; }

          name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$APP/Contents/Info.plist" 2>/dev/null || true)
          if [ "$name" != "MegaPDF" ]; then
            echo "::error::CFBundleIconFile is '$name', expected 'MegaPDF'"
            exit 1
          fi

          iconutil -c iconset "$ICNS" -o "$RUNNER_TEMP/icon.iconset"
          echo "representations macOS read back:"
          ls -1 "$RUNNER_TEMP/icon.iconset"

          # Ten in, ten out. A container that parses but drops sizes leaves
          # Finder upscaling a small one, which looks like a blurry icon rather
          # than a broken build.
          count=$(ls -1 "$RUNNER_TEMP/icon.iconset" | wc -l | tr -d ' ')
          if [ "$count" -lt 10 ]; then
            echo "::error::only $count representations survived the round trip, expected 10"
            exit 1
          fi

          # macOS does not mask app icons: the rounded shape and its margin have
          # to be in the pixels. Apple's grid puts the shape in the middle 824 of
          # 1024, so a fully-opaque bounding box that reaches the canvas edge
          # means the icon will render square and oversized in the Dock.
          sips -g pixelWidth -g pixelHeight "$RUNNER_TEMP/icon.iconset/icon_512x512.png"
          python3 - "$RUNNER_TEMP/icon.iconset/icon_512x512.png" <<'PYCHECK'
          import sys, struct, zlib
          # No PIL on the runner; read the PNG's alpha directly.
          data = open(sys.argv[1], 'rb').read()
          pos, idat, w, h = 8, b'', 0, 0
          while pos < len(data):
              ln = struct.unpack('>I', data[pos:pos+4])[0]
              kind = data[pos+4:pos+8]
              body = data[pos+8:pos+8+ln]
              if kind == b'IHDR':
                  w, h, depth, colour = struct.unpack('>IIBB', body[:10])
                  assert depth == 8 and colour == 6, f'expected 8-bit RGBA, got {depth}/{colour}'
              elif kind == b'IDAT':
                  idat += body
              elif kind == b'IEND':
                  break
              pos += 12 + ln
          raw = zlib.decompress(idat)
          stride = w * 4
          prev = bytearray(stride)
          top = left = None
          bottom = right = 0
          for y in range(h):
              ft = raw[y * (stride + 1)]
              line = bytearray(raw[y * (stride + 1) + 1:(y + 1) * (stride + 1)])
              for i in range(stride):
                  a = line[i - 4] if i >= 4 else 0
                  b = prev[i]
                  c = prev[i - 4] if i >= 4 else 0
                  if ft == 1: line[i] = (line[i] + a) & 0xFF
                  elif ft == 2: line[i] = (line[i] + b) & 0xFF
                  elif ft == 3: line[i] = (line[i] + (a + b) // 2) & 0xFF
                  elif ft == 4:
                      p = a + b - c
                      pa, pb, pc = abs(p - a), abs(p - b), abs(p - c)
                      pr = a if (pa <= pb and pa <= pc) else (b if pb <= pc else c)
                      line[i] = (line[i] + pr) & 0xFF
              for x in range(w):
                  if line[x * 4 + 3] > 250:
                      if top is None: top = y
                      left = x if left is None else min(left, x)
                      right = max(right, x)
                      bottom = y
              prev = line
          margin = min(left, top, w - 1 - right, h - 1 - bottom)
          expected = round(100 * w / 1024)
          print(f'opaque shape: {left},{top}..{right},{bottom} in {w}x{h}; margin {margin}px, expected ~{expected}px')
          if abs(margin - expected) > 4:
              print(f"::error::icon margin is {margin}px against Apple's ~{expected}px grid, so it will render the wrong size beside other Dock icons")
              raise SystemExit(1)
          PYCHECK

      # French (#91). The catalogue itself is bundled into the single-file
      # apphost, so what can go missing at bundle time is the plist declaration
      # and the per-language InfoPlist.strings — which is what the App Store
      # reads to list the app's languages, and what Finder reads for the
      # document type name. Checked the way CFBundleIconFile is above.
      - name: The bundle declares its languages
        run: |
          APP="$RUNNER_TEMP/app/MegaPDF.app"
          PLIST="$APP/Contents/Info.plist"

          region=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDevelopmentRegion' "$PLIST" 2>/dev/null || true)
          if [ "$region" != "en" ]; then
            echo "::error::CFBundleDevelopmentRegion is '$region', expected 'en'"
            exit 1
          fi

          langs=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleLocalizations' "$PLIST" 2>/dev/null || true)
          echo "CFBundleLocalizations: $(echo "$langs" | tr -s '[:space:]' ' ')"
          for lang in en fr fr-CA; do
            if ! echo "$langs" | grep -qx "[[:space:]]*$lang[[:space:]]*"; then
              echo "::error::CFBundleLocalizations does not list '$lang'"
              exit 1
            fi
            test -f "$APP/Contents/Resources/$lang.lproj/InfoPlist.strings" \
              || { echo "::error::no $lang.lproj/InfoPlist.strings in the bundle"; exit 1; }
          done

          # The satellite must be inside the apphost, not loose beside it — a
          # loose fr/ folder in Contents/MacOS is unsigned code the seal would
          # reject, and it would mean PublishSingleFile stopped bundling it.
          if [ -d "$APP/Contents/MacOS/fr" ]; then
            echo "::error::Contents/MacOS/fr exists — the French satellite was not bundled into the single file"
            exit 1
          fi

      # The design tokens are looked up by name at runtime, and a name that does
      # not resolve fails silently — Brand.Brush hands back a transparent brush,
      # so the selection border and focus ring stop being drawn while every other
      # check still passes. Building proves Brand.axaml parses; only this proves
      # the keys are reachable, in both theme variants.
      - name: Design tokens resolve
        run: |
          "$RUNNER_TEMP/app/MegaPDF.app/Contents/MacOS/MegaPDF" --brand-check

      # Printing goes through PDFKit and AppKit by Objective-C runtime interop, so
      # the binding surface is the risk: a wrong objc_msgSend signature returns a
      # plausible-looking pointer rather than throwing. This resolves every class
      # and selector, builds a real PDFDocument, and requires its page count to
      # agree with PdfiumEngine. It stops before the print panel, which CI cannot
      # reach.
      - name: Printing interop is sound
        run: |
          "$RUNNER_TEMP/app/MegaPDF.app/Contents/MacOS/MegaPDF" --print-check \
            "$RUNNER_TEMP/fixtures/fixture.pdf"

      - name: The UI actually starts
        run: |
          APP="$RUNNER_TEMP/app/MegaPDF.app/Contents/MacOS/MegaPDF"
          "$APP" "$RUNNER_TEMP/fixtures/stamped.pdf" > "$RUNNER_TEMP/ui.log" 2>&1 &
          PID=$!
          sleep 10
          if kill -0 "$PID" 2>/dev/null; then
            echo "UI start: PASS — still running after 10s"
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
          else
            echo "::error::UI start: the app exited on its own. Output follows."
            cat "$RUNNER_TEMP/ui.log"
            exit 1
          fi
          echo "--- app output:"; cat "$RUNNER_TEMP/ui.log"

      # Zip explicitly: upload-artifact does not preserve the executable bit, which
      # would leave the downloaded .app unable to launch.
      - name: Package
        run: |
          cd "$RUNNER_TEMP/app"
          zip -qry "$RUNNER_TEMP/MegaPDF-${{ matrix.rid }}.zip" MegaPDF.app
          ls -lh "$RUNNER_TEMP/MegaPDF-${{ matrix.rid }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: MegaPDF-macos-${{ matrix.rid }}
          path: ${{ runner.temp }}/MegaPDF-${{ matrix.rid }}.zip
          if-no-files-found: error

  # ==========================================================================
  # Mac App Store viability probe. MAS makes the App Sandbox mandatory, and
  # Avalonia has a standing report of sandboxed .NET apps crashing on arm64
  # (AvaloniaUI/Avalonia#9764). Every other piece of a MAS pipeline — the
  # certificates, the provisioning profile, productbuild, the .pkg upload — is
  # wasted effort if the answer here is no. So this runs first and alone.
  #
  # It is written to be falsifiable. Under a real sandbox, --render-check must
  # be DENIED: that fixture is neither user-selected nor in the app container.
  # A render-check that passes means the sandbox is not actually engaged and
  # the result proves nothing, which is why the embedded entitlements are
  # dumped and checked rather than assumed.
  # ==========================================================================
  sandbox-probe:
    name: App Sandbox viability (${{ matrix.rid }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build a sandboxed bundle
        env:
          MACOS_ENTITLEMENTS: tools/macos/sandbox.entitlements
        run: tools/build-macos-app.sh ${{ matrix.rid }} "$RUNNER_TEMP/sandboxed"

      - name: Is the sandbox actually engaged?
        run: |
          APP="$RUNNER_TEMP/sandboxed/MegaPDF.app"
          echo "--- embedded entitlements:"
          codesign -d --entitlements - "$APP" 2>&1 | tee "$RUNNER_TEMP/ents.txt"
          if grep -q "app-sandbox" "$RUNNER_TEMP/ents.txt"; then
            echo "app-sandbox IS present in the signature"
          else
            echo "::error::app-sandbox is NOT in the signature — every result below is meaningless"
            exit 1
          fi

      # Expected to FAIL. A pass means the sandbox is not restricting file access.
      - name: File access outside the container should be DENIED
        continue-on-error: true
        run: |
          python3 tools/gen_test_fixtures.py "$RUNNER_TEMP/fixtures"
          # The #173 redaction fixtures land in the same directory; the names do not clash.
          python3 tools/gen_redaction_fixtures.py "$RUNNER_TEMP/fixtures"
          if "$RUNNER_TEMP/sandboxed/MegaPDF.app/Contents/MacOS/MegaPDF" --render-check \
               "$RUNNER_TEMP/fixtures/stamped.pdf"; then
            echo "::warning::render-check SUCCEEDED — the sandbox is not restricting file reads."
            echo "SANDBOX_FILE_ACCESS=unrestricted" >> "$GITHUB_ENV"
          else
            echo "render-check was denied, which is the sandbox working as designed."
            echo "SANDBOX_FILE_ACCESS=restricted" >> "$GITHUB_ENV"
          fi

      # THE question. If this fails we have hit Avalonia#9764 and MAS is blocked
      # on an upstream bug rather than on anything in this repo.
      - name: Does the UI survive the sandbox?
        run: |
          APP="$RUNNER_TEMP/sandboxed/MegaPDF.app/Contents/MacOS/MegaPDF"
          "$APP" > "$RUNNER_TEMP/ui.log" 2>&1 &
          PID=$!
          sleep 12
          if kill -0 "$PID" 2>/dev/null; then
            echo "SANDBOX UI: PASS — Avalonia is alive after 12s under the sandbox"
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
          else
            echo "::error::SANDBOX UI: the app died under the sandbox (see Avalonia#9764)."
            cat "$RUNNER_TEMP/ui.log"
            exit 1
          fi
          echo "--- app output:"; cat "$RUNNER_TEMP/ui.log"

      - name: Verdict
        if: always()
        run: |
          echo "sandbox file access: ${SANDBOX_FILE_ACCESS:-unknown}"
          echo "See the step results above: UI survival is the go/no-go for Mac App Store."

  # ==========================================================================
  # The engine, on macOS. This ran in the ADR-002 spike and lost its home when
  # that workflow was retired — leaving Core covered on Windows only, which is
  # the wrong way round for a port whose whole premise is that Core is shared.
  #
  # Nothing is excluded. ImageCompressionTests used to be carved out because the
  # test project pulled System.Drawing.Common, which throws
  # PlatformNotSupportedException off Windows (ADR-002 fact 5). It now encodes
  # through SkiaSharp — already in the tree, since Avalonia renders with it — so
  # there is no longer anything this suite can do on Windows and not on macOS.
  # ==========================================================================
  core-tests-macos:
    name: Core tests on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Into its default home, libs/pdfium/mac-univ: that is where the Core project
      # copies libpdfium.dylib from, and where core/CMakeLists.txt links the shared
      # engine core against it (#38). Both then land beside the test assembly on
      # their own, so no copy step is needed.
      - name: Fetch pinned PDFium
        run: tools/fetch-pdfium-mac.sh

      - name: Build the test project (builds libmegapdf_core.dylib on the way)
        run: dotnet build tests/MegaPDF.Core.Tests/MegaPDF.Core.Tests.csproj -c Release

      - name: Run the whole Core suite
        run: |
          dotnet test tests/MegaPDF.Core.Tests/MegaPDF.Core.Tests.csproj \
            -c Release --no-build --logger "console;verbosity=normal"

  # ==========================================================================
  # megapdf-cli release (#142, #356): a universal (arm64 + x86_64) binary, Developer
  # ID signed and notarized the way tools/notarize-macos-app.sh already does for the
  # app bundle, zipped with megapdf_core, pdfium, LICENSE and THIRD-PARTY-NOTICES, and
  # attached to a draft GitHub release. macos-cli-v* only — see the tag comment above;
  # this never touches the Mac App Store package (macos-appstore.yml).
  #
  # Stapling only applies to a signed app bundle, .pkg or .dmg (Apple's stapler has no
  # loose-binary form), so this zip is NOT stapled — notarize-macos-app.sh's own job.
  # It IS submitted for notarization and accepted before it ships, which is what lets
  # Gatekeeper's online ticket check pass on a Mac with internet on first run, even
  # unstapled.
  #
  # Build and signing run on a pull request too, the way the tarball job in
  # linux-release.yml rehearses everything up to the tag-only publish step. Only the
  # notarization step itself is skipped there (see its own `if`): notarizing means
  # `notarytool submit`, which UPLOADS THE BUILD TO APPLE, and macos-tester-build.yml's
  # own header explains why that must never fire on every pull request (#173 did
  # exactly that, five times, before anyone noticed).
  # ==========================================================================
  cli-release:
    name: megapdf-cli release archive (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: The version this build carries
        id: version
        run: |
          v=$(grep -oE '<Version>[^<]+</Version>' src/MegaPDF.Avalonia/MegaPDF.Avalonia.csproj | head -1 | sed 's/<[^>]*>//g')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "building megapdf-cli $v"

      # A tag names the version it releases.
      - name: The tag matches the version
        if: startsWith(github.ref, 'refs/tags/macos-cli-v')
        run: |
          [ "macos-cli-v${{ steps.version.outputs.version }}" = "$GITHUB_REF_NAME" ] || {
            echo "::error::tag $GITHUB_REF_NAME, but this tree builds ${{ steps.version.outputs.version }}"; exit 1; }

      - name: Fetch pinned PDFium (universal)
        run: tools/fetch-pdfium-mac.sh

      # CMAKE_OSX_ARCHITECTURES is set to "arm64;x86_64" before project() in
      # core/CMakeLists.txt whenever the host is Apple, so this one configure and
      # build already produces a universal megapdf-cli, exactly like the universal
      # libmegapdf_core.dylib the app bundle links.
      - name: Build the universal megapdf-cli
        run: |
          set -e
          cmake -S core -B core/build/osx -DCMAKE_BUILD_TYPE=Release
          cmake --build core/build/osx --target megapdf_cli --config Release
          BIN=core/build/osx/megapdf-cli
          [ -x "$BIN" ] || { echo "::error::$BIN was not built"; exit 1; }
          lipo -archs "$BIN"
          "$BIN" --version

      # Signed with Developer ID + Hardened Runtime, the way tools/build-macos-app.sh
      # signs the app bundle (same env vars, same keychain dance) — but per file, since
      # there is no bundle here to sign as one unit. Ad-hoc signed (no-op for
      # notarization) when the secrets are absent, e.g. a fork's workflow_dispatch.
      - name: Sign with Developer ID
        env:
          MACOS_DEVID_P12_B64: ${{ secrets.MACOS_DEVID_P12_B64 }}
          MACOS_DEVID_P12_PASSWORD: ${{ secrets.MACOS_DEVID_P12_PASSWORD }}
          MACOS_DEVID_IDENTITY: ${{ secrets.MACOS_DEVID_IDENTITY }}
        run: |
          set -e
          BIN=core/build/osx/megapdf-cli
          DYLIB=core/build/osx/libmegapdf_core.dylib
          PDFIUM=core/build/osx/libpdfium.dylib
          if [ -n "${MACOS_DEVID_P12_B64:-}" ]; then
            : "${MACOS_DEVID_P12_PASSWORD:?}"
            : "${MACOS_DEVID_IDENTITY:?}"
            KEYCHAIN="$RUNNER_TEMP/megapdf-cli-signing.keychain-db"
            KEYCHAIN_PW="$(openssl rand -base64 24)"
            security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
            echo "$MACOS_DEVID_P12_B64" | base64 -d > "$RUNNER_TEMP/devid.p12"
            security import "$RUNNER_TEMP/devid.p12" -k "$KEYCHAIN" \
              -P "$MACOS_DEVID_P12_PASSWORD" -T /usr/bin/codesign
            rm -f "$RUNNER_TEMP/devid.p12"
            security set-key-partition-list -S apple-tool:,apple:,codesign: \
              -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
            security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
            IDENTITY="$MACOS_DEVID_IDENTITY"
            echo "signing identity: $IDENTITY (hardened runtime, secure timestamp)"
          else
            IDENTITY="-"
            echo "signing identity: ad-hoc (no MACOS_DEVID_P12_B64 — a fork or a rehearsal run)"
          fi
          for f in "$PDFIUM" "$DYLIB" "$BIN"; do
            if [ "$IDENTITY" = "-" ]; then
              codesign --force --sign - "$f"
            else
              codesign --force --timestamp --options runtime --sign "$IDENTITY" "$f"
            fi
          done
          codesign --verify --verbose=2 "$BIN" "$DYLIB" "$PDFIUM"
          echo "signed=$([ "$IDENTITY" != "-" ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"
        id: sign

      - name: The zip (binary, megapdf_core, pdfium, LICENSE, THIRD-PARTY-NOTICES)
        id: zip
        run: |
          set -e
          VERSION="${{ steps.version.outputs.version }}"
          STAGE="$RUNNER_TEMP/megapdf-cli-macos-universal-$VERSION"
          mkdir -p "$STAGE"
          cp core/build/osx/megapdf-cli "$STAGE/"
          cp core/build/osx/libmegapdf_core.dylib "$STAGE/"
          cp core/build/osx/libpdfium.dylib "$STAGE/"
          cp LICENSE "$STAGE/LICENSE"
          cp src/MegaPDF.Avalonia/Assets/THIRD-PARTY-NOTICES.txt "$STAGE/THIRD-PARTY-NOTICES.txt"
          mkdir -p artifacts/release
          ZIP="artifacts/release/megapdf-cli-macos-universal-$VERSION.zip"
          # ditto, not zip: it preserves the code signature, same as
          # notarize-macos-app.sh's own packing step.
          ditto -c -k --keepParent "$STAGE" "$ZIP"
          ( cd artifacts/release && shasum -a 256 "$(basename "$ZIP")" > "$(basename "$ZIP").sha256" )
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          ls -lh artifacts/release

      # NOT via tools/notarize-macos-app.sh: that script requires a directory (a .app
      # bundle, `[ -d "$APP" ]`) and stples the ticket into it afterwards, and stapling
      # a loose-file zip is not a thing the stapler does. The submission and acceptance
      # wait are the same notarytool call that script makes; only the packaging and the
      # (absent) stapling step differ.
      - name: Notarize (no stapling — see above)
        if: steps.sign.outputs.signed == '1' && github.event_name != 'pull_request'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -e
          : "${ASC_KEY_P8:?}"; : "${ASC_KEY_ID:?}"; : "${ASC_ISSUER_ID:?}"
          if printf '%s' "$ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/key.p8"
          else
            printf '%s' "$ASC_KEY_P8" | base64 -d > "$RUNNER_TEMP/key.p8"
          fi
          xcrun notarytool submit "${{ steps.zip.outputs.zip }}" \
            --key "$RUNNER_TEMP/key.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" \
            --wait --timeout 30m | tee "$RUNNER_TEMP/submit.log"
          grep -qE "status: Accepted" "$RUNNER_TEMP/submit.log" || {
            echo "::error::notarization was not accepted"; exit 1; }
          rm -f "$RUNNER_TEMP/key.p8"

      - uses: actions/upload-artifact@v4
        with:
          name: MegaPDF-cli-macos-release
          path: |
            artifacts/release/megapdf-cli-macos-universal-*.zip
            artifacts/release/megapdf-cli-macos-universal-*.zip.sha256
          if-no-files-found: error

  cli-release-publish:
    name: Draft the release
    needs: cli-release
    if: startsWith(github.ref, 'refs/tags/macos-cli-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MegaPDF-cli-macos-release
          path: artifacts

      - name: The zip and its checksum, in a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#macos-cli-v}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --draft --verify-tag --title "megapdf-cli $VERSION for macOS" \
              --notes "megapdf-cli $VERSION for macOS (universal: arm64 + x86_64). Unpack the zip and run megapdf-cli from a shell — this is a command-line tool, not the MegaPDF app, which ships through the Mac App Store. Signed with the app's Developer ID and notarized (Apple accepted it); it is not stapled, because Apple's stapler only attaches to an app bundle, .pkg or .dmg — Gatekeeper checks the notarization online instead on first run, which needs internet once. Each zip's sha256 is beside it."
          gh release upload "$TAG" \
            artifacts/megapdf-cli-macos-universal-*.zip \
            artifacts/megapdf-cli-macos-universal-*.zip.sha256 \
            --clobber
          gh release view "$TAG" --json isDraft,tagName,assets \
            --jq '"draft=\(.isDraft) \(.tagName): \([.assets[].name] | join(", "))"'
