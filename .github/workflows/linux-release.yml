# The Linux tag build (#254 A3, #158): the release tarball, the .deb, the signed APT
# repository built from that .deb, and the generated Flathub manifest, each one proved
# by installing it and running the app out of it.
#
# Tag a commit `linux-v2.0.0` and the tarball, the .deb and their checksums go into a
# **draft** GitHub release of that name. The Linux series has a tag prefix of its own,
# like ios-v* and android-v*, rather than the bare v* that v1.3.0 … v1.6.2 used for the
# retired Windows sideload builds. Those builds' updater reads /releases/latest and
# offers only a newer, parseable tag carrying a .msix, so a Linux release can never
# reach it, whatever it is called (proved against the retired code on #158).
# `workflow_dispatch` and pull requests do everything except the release.
#
# NOTHING HERE PUBLISHES ANYTHING. The release is a draft until a person publishes it.
# The APT repository is an artefact that website/deploy.py uploads to electricrv.ca
# when Dave says so (tools/Linux-Packaging.md, "Going live"). And opening a pull
# request against flathub/flathub is a person's step.
name: Linux release

on:
  workflow_dispatch:
  push:
    tags: ['linux-v*']
  # The tag path cannot be rehearsed on a pull request, so everything up to it is
  # rehearsed instead, whenever any of the pieces change.
  pull_request:
    paths:
      - '.github/workflows/linux-release.yml'
      - 'tools/linux/make-release-tarball.sh'
      - 'tools/linux/make-flathub-manifest.sh'
      - 'tools/linux/build-flathub-flatpak.sh'
      - 'tools/linux/flatpak/**'
      - 'tools/build-linux-app.sh'
      - 'tools/linux/build-deb.sh'
      - 'tools/linux/make-apt-repo.sh'
      - 'tools/linux/check-apt-repo.sh'
      - 'tools/linux/package-version.sh'
      - 'tools/linux/PACKAGE-REVISION'
      - 'tools/linux/install.sh'
      - 'tools/linux/uninstall.sh'
      - 'tools/linux/flatpak/*.metainfo.xml'
      - 'website/megapdf/apt/**'

permissions:
  contents: read

jobs:
  tarball:
    name: Tarball, .deb, APT repository and Flathub manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak flatpak-builder appstream \
            desktop-file-utils librsvg2-common xvfb dbus apt-utils gnupg

      - name: Build the shared engine core and the app
        run: tools/build-linux-app.sh linux-x64 artifacts/linux

      # The tarball, and the check that the metainfo's newest <release> is this version
      # with a date that is not months old. A listing whose history stops at the
      # previous version is wrong in a way nobody sees for years.
      - name: The release tarball and its checksum
        run: tools/linux/make-release-tarball.sh artifacts/linux/MegaPDF artifacts/release

      # A tag names the version it releases. linux-v2.0.1 on a tree that says 2.0.0
      # would publish a release whose files contradict its name. The version is the
      # package's: the app's, plus the packaging revision in
      # tools/linux/PACKAGE-REVISION when there is one (linux-v2.0.0-2, #315).
      - name: The tag matches the version
        if: startsWith(github.ref, 'refs/tags/linux-v')
        run: |
          built="$(tools/linux/package-version.sh "$(tr -d '[:space:]' < artifacts/linux/MegaPDF/VERSION)")"
          [ "linux-v$built" = "$GITHUB_REF_NAME" ] || {
            echo "::error::tag $GITHUB_REF_NAME, but this tree builds $built"; exit 1; }

      - name: The .deb and its checksum
        run: |
          set -e
          tools/linux/build-deb.sh artifacts/linux/MegaPDF artifacts/deb
          cp artifacts/deb/megapdf_*_amd64.deb artifacts/release/
          (cd artifacts/release && for f in megapdf_*_amd64.deb; do sha256sum "$f" > "$f.sha256"; done)

      # Two manifests from one template: the one a Flathub pull request would contain,
      # naming the release URL, and the same thing pointed at the file on disk so this
      # run can build it before anything is published.
      - name: The Flathub manifest
        run: |
          set -e
          TARBALL=$(ls artifacts/release/megapdf-linux-x64-*.tar.gz)
          tools/linux/make-flathub-manifest.sh "$TARBALL" \
            artifacts/release/ca.electricrv.MegaPDF.yml
          tools/linux/make-flathub-manifest.sh "$TARBALL" --local \
            artifacts/release/ca.electricrv.MegaPDF.local.yml

      - name: The freedesktop runtime the manifest names
        run: |
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          runtime=$(grep -E "^runtime-version:" artifacts/release/ca.electricrv.MegaPDF.yml | tr -d "' " | cut -d: -f2)
          flatpak install -y --noninteractive --user flathub \
            "org.freedesktop.Platform//$runtime" "org.freedesktop.Sdk//$runtime"

      # The point of the whole job: the manifest Flathub will run, built from the
      # artefact this run produced. Not the local manifest, which reads paths that only
      # exist in this repository.
      - name: Build the Flatpak from the manifest, from the tarball
        run: tools/linux/build-flathub-flatpak.sh artifacts/release/ca.electricrv.MegaPDF.local.yml artifacts/flathub

      - name: Generate fixtures
        run: |
          python3 tools/gen_test_fixtures.py "$RUNNER_TEMP/fixtures"
          python3 tools/gen_redaction_fixtures.py "$RUNNER_TEMP/fixtures"

      # A bundle that exists proves nothing: this installs it and drives the app inside
      # the sandbox, which is the same check ci.yml runs against the locally built one.
      - name: Install it and run the app inside its sandbox
        run: tools/linux/check-flatpak.sh artifacts/flathub/ca.electricrv.MegaPDF.flatpak "$RUNNER_TEMP/fixtures"

      # Every .deb already published stays in the repository, so the site can replace
      # the repository wholesale without taking away a version someone has pinned, and
      # apt upgrade sees the path from each one to this one. Downloaded from the
      # published (not draft) linux-v* releases into the pool, which make-apt-repo.sh
      # keeps.
      - name: The .debs already published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          POOL=artifacts/apt/pool/main/m/megapdf
          mkdir -p "$POOL"
          for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
                         --json tagName,isDraft --jq '.[] | select(.isDraft | not) | .tagName' \
                       | grep '^linux-v' || true); do
            [ "$tag" = "$GITHUB_REF_NAME" ] && continue
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
              --pattern 'megapdf_*_amd64.deb' --dir "$POOL" --skip-existing
          done
          ls -l "$POOL"

      # Signed with the repository key, which the environment hands over and the script
      # imports from stdin, never from a command line. A pull request from a fork has no
      # secrets, so there this step says so and stops short.
      - name: The signed APT repository
        id: apt
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          if [ -z "$APT_SIGNING_KEY" ]; then
            echo "::notice::no signing key here (a fork?), so no APT repository is built"
            exit 0
          fi
          tools/linux/make-apt-repo.sh artifacts/apt artifacts/release/megapdf_*_amd64.deb
          echo "built=1" >> "$GITHUB_OUTPUT"

      # The repository the way a person meets it: subscribe as the website says, install,
      # run the app, see a newer version arrive through apt upgrade, and see a stranger's
      # signature refused. In clean Debian 12 and 13 and Ubuntu 22.04, 24.04 and 26.04
      # containers, plus a Debian 12 that installs without recommends (#315, #316).
      - name: Install from the APT repository, upgrade, and refuse a forgery
        if: steps.apt.outputs.built == '1'
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: tools/linux/check-apt-repo.sh artifacts/apt "$RUNNER_TEMP/fixtures"

      - name: Flathub's linter, on the manifest that would be submitted
        run: |
          flatpak install -y --noninteractive --user flathub org.flatpak.Builder
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder \
            manifest artifacts/release/ca.electricrv.MegaPDF.yml

      - name: What this run produced
        run: |
          {
            echo "### Linux release artefacts"
            echo
            echo '```'
            ls -l artifacts/release
            echo '```'
            echo
            echo "**sha256**:"
            echo
            echo '```'
            cat artifacts/release/*.sha256
            echo '```'
            echo
            echo "The \`sources:\` block of the manifest a Flathub pull request would carry:"
            echo
            echo '```yaml'
            sed -n '/^ *sources:/,$p' artifacts/release/ca.electricrv.MegaPDF.yml
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: MegaPDF-linux-release
          path: |
            artifacts/release/megapdf-linux-x64-*.tar.gz
            artifacts/release/megapdf-linux-x64-*.tar.gz.sha256
            artifacts/release/megapdf_*_amd64.deb
            artifacts/release/megapdf_*_amd64.deb.sha256
            artifacts/release/ca.electricrv.MegaPDF.yml
            artifacts/flathub/ca.electricrv.MegaPDF.flatpak
          if-no-files-found: error

      # What website/deploy.py uploads to electricrv.ca/megapdf/apt/ on the day: download
      # it into website/megapdf/apt/ (tools/Linux-Packaging.md, "Going live").
      - uses: actions/upload-artifact@v4
        if: steps.apt.outputs.built == '1'
        with:
          name: MegaPDF-apt-repository
          path: artifacts/apt
          if-no-files-found: error

  # A job of its own, so the write permission exists only on a tag run and never on
  # the pull-request rehearsal above. It builds nothing: it puts what that job already
  # made, and already installed and ran, into a DRAFT release. Publishing it is a
  # person's click (Dave's go-ahead; Linux ships after the other platforms).
  publish:
    name: Draft the release
    needs: tarball
    if: startsWith(github.ref, 'refs/tags/linux-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MegaPDF-linux-release
          path: artifacts

      # Neither creates a tag nor touches any other release. `--verify-tag` refuses a
      # tag that is not already pushed. A re-run of the same tag replaces the files in
      # the draft rather than making a second release.
      - name: The tarball, the .deb and their checksums, in a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#linux-v}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --draft --verify-tag --title "MegaPDF $VERSION for Linux" \
              --notes "MegaPDF $VERSION for Linux (x86-64). How to install it, including the APT repository that keeps it up to date: https://electricrv.ca/megapdf/linux/ — each file's sha256 is beside it."
          gh release upload "$TAG" \
            artifacts/release/megapdf-linux-x64-*.tar.gz \
            artifacts/release/megapdf-linux-x64-*.tar.gz.sha256 \
            artifacts/release/megapdf_*_amd64.deb \
            artifacts/release/megapdf_*_amd64.deb.sha256 \
            --clobber
          gh release view "$TAG" --json isDraft,tagName,assets \
            --jq '"draft=\(.isDraft) \(.tagName): \([.assets[].name] | join(", "))"'
