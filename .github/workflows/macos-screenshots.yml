# Captures what the macOS app actually looks like, so it can be reviewed by
# someone who does not have a Mac and has not built it.
#
# iOS and Android already have this (ios-screenshots.yml, android-screenshots.yml)
# and Windows has tools/screenshots-windows/. macOS was the gap — which meant the
# newest and least-seen of the four apps was also the only one nobody could look
# at without checking out the repo and building it.
#
# Not store screenshots: those need a feature-complete listing pass and their own
# sizes. These are for design review and for pull requests that change the UI.
name: macOS screenshots

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/MegaPDF.Avalonia/**'
      - '.github/workflows/macos-screenshots.yml'

jobs:
  screenshots:
    name: What the app looks like
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: tools/build-macos-app.sh osx-arm64 "$RUNNER_TEMP/app"

      - name: Fixtures
        run: python3 tools/gen_test_fixtures.py "$RUNNER_TEMP/fixtures"

      - name: Capture
        run: |
          APP="$RUNNER_TEMP/app/MegaPDF.app/Contents/MacOS/MegaPDF"
          OUT="$RUNNER_TEMP/screenshots"
          mkdir -p "$OUT"

          # The app renders its own window rather than the OS capturing the screen.
          # screencapture needs Screen Recording permission, and on a runner that
          # means a system prompt that appears ON TOP of the thing being
          # photographed — which is what spoiled the first set. This also gives the
          # window alone, with no desktop or dock around it.
          #
          # Sandboxed, so fixtures have to live in the app's own container.
          CONTAINER="$HOME/Library/Containers/com.megapdf.ios/Data"
          "$APP" --self-test "$RUNNER_TEMP/fixtures" >/dev/null 2>&1 || true
          mkdir -p "$CONTAINER/tmp/fixtures"
          cp "$RUNNER_TEMP"/fixtures/*.pdf "$CONTAINER/tmp/fixtures/" 2>/dev/null || true

          "$APP" --screenshot "$OUT/01-empty-state.png"
          "$APP" "$CONTAINER/tmp/fixtures/demo.pdf" --screenshot "$OUT/02-document-open.png"
          "$APP" "$CONTAINER/tmp/fixtures/formtext.pdf" --screenshot "$OUT/03-form.png"

          # The three above have nothing selected and no search running, so not
          # one pixel of the brand accent appears in any of them (#80). These are
          # the states that show the colour tokens actually reaching the screen.
          "$APP" "$CONTAINER/tmp/fixtures/demo.pdf" --screenshot-state find \
              --screenshot "$OUT/04-find.png"
          "$APP" "$CONTAINER/tmp/fixtures/formtext.pdf" --screenshot-state focus \
              --screenshot "$OUT/05-focus-ring.png"
          "$APP" "$CONTAINER/tmp/fixtures/demo.pdf" --screenshot-state mode \
              --screenshot "$OUT/06-mode-banner.png"

          # Dark. Every token is defined twice and only the light half has ever
          # been looked at; the parity test proves both halves define a token,
          # not that the dark value is right.
          "$APP" --theme dark --screenshot "$OUT/07-dark-empty.png"
          "$APP" "$CONTAINER/tmp/fixtures/demo.pdf" --theme dark \
              --screenshot-state find --screenshot "$OUT/08-dark-find.png"
          "$APP" "$CONTAINER/tmp/fixtures/demo.pdf" --theme dark \
              --screenshot-state mode --screenshot "$OUT/09-dark-mode-banner.png"
          # The signature library (#100): seeded from the repo's sample ink, since
          # the built app sits outside the checkout and cannot find it by walking up.
          SIG="$GITHUB_WORKSPACE/tools/assets/megawoman-sig.jpg"
          "$APP" "$CONTAINER/tmp/fixtures/demo.pdf" --screenshot-state sign \
              --signature "$SIG" --screenshot "$OUT/10-sign.png"
          "$APP" "$CONTAINER/tmp/fixtures/demo.pdf" --theme dark --screenshot-state sign \
              --signature "$SIG" --screenshot "$OUT/11-dark-sign.png"

          # About MegaPDF and its third-party notices (#176), in all three
          # languages and both themes — the only screens in the app whose whole
          # content is text, so a clipped translation shows up nowhere else. The
          # state renders the panel to <out>-dialog.png beside the window; the
          # window file itself is the same main window as 02 and is dropped.
          # The app menu that leads to About is macOS's own NSMenu and no window
          # renderer can reach it: --self-test checks that one.
          for lang in en fr-CA fr; do
            for theme in light dark; do
              for state in about notices; do
                "$APP" "$CONTAINER/tmp/fixtures/demo.pdf" --language "$lang" --theme "$theme" \
                    --screenshot-state "$state" \
                    --screenshot "$OUT/12-$state-$lang-$theme.png"
                rm -f "$OUT/12-$state-$lang-$theme.png"
              done
            done
          done

          ls -la "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-screenshots
          path: ${{ runner.temp }}/screenshots/*.png
          if-no-files-found: warn
