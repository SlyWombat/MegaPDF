# ADR-002 spike — does MegaPDF.Core run on macOS, and does an Avalonia shell
# bundle and launch there? See docs/adr-002-macos-desktop.md §6.
#
# This workflow answers a decision question; it is not part of the product CI.
# Delete it, tools/fetch-pdfium-mac.sh and spike/ once ADR-002 is decided.
#
# The two jobs are deliberately independent (no `needs:`) — job 2 is the more
# exploratory half and must never obscure job 1's answer.
name: macOS spike (ADR-002)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/macos-spike.yml'
      - 'tools/fetch-pdfium-mac.sh'
      - 'spike/**'

jobs:
  # ==========================================================================
  # JOB 1 — the load-bearing one. Runs the SHIPPING Core test suite, unmodified,
  # on macOS against libpdfium.dylib. Green here means the engine ports for zero
  # engine-code change and ADR-002 Options B/C become mostly a UI exercise.
  #
  # No repo source changes are needed to run this: Core's unconditional win-x64
  # pdfium.dll copy item succeeds on macOS (the DLL is committed), it just lands
  # a useless file beside the tests. The dylib is overlaid on top.
  # ==========================================================================
  engine-spike:
    name: Engine — Core test suite on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Fetches pdfium-mac-univ (2-slice fat binary: x86_64 + arm64) at the build
      # pinned in libs/pdfium/win-x64/VERSION, and FAILS if the slice reports a
      # different build — SDD §6.1's pinning doctrine, machine-enforced.
      - name: Fetch pinned PDFium (macOS universal)
        run: tools/fetch-pdfium-mac.sh "$RUNNER_TEMP/pdfium-mac"

      # NOT `dotnet test MegaPDF.sln` — that is what ci.yml runs, and it would
      # fail here for the wrong reason: the solution includes MegaPDF.App, which
      # is WinExe / net8.0-windows10.0.19041.0 and will not restore off Windows.
      - name: Build the Core test project
        run: dotnet build tests/MegaPDF.Core.Tests/MegaPDF.Core.Tests.csproj -c Release

      # Order matters: build, then place the dylib, then run with --no-build.
      # .NET resolves the bare name "pdfium" (PdfiumNative.Dll) relative to the
      # assembly directory, so the test output dir is the correct home.
      - name: Place libpdfium.dylib beside the test assembly
        run: |
          OUT=tests/MegaPDF.Core.Tests/bin/Release/net8.0
          cp "$RUNNER_TEMP/pdfium-mac/lib/libpdfium.dylib" "$OUT/"
          ls -la "$OUT"/*.dylib "$OUT"/*.dll 2>/dev/null | head

      # The gate. ImageCompressionTests is excluded by design, not by accident:
      # the test project pulls System.Drawing.Common ("Windows-only, tests-only"
      # per its own csproj comment), which throws PlatformNotSupportedException
      # off Windows. Those 3 tests are run separately below so the expectation
      # becomes a logged fact rather than an ADR assumption.
      - name: Run the suite (excluding the known-Windows-only tests)
        run: |
          dotnet test tests/MegaPDF.Core.Tests/MegaPDF.Core.Tests.csproj \
            -c Release --no-build \
            --filter "FullyQualifiedName!~ImageCompressionTests" \
            --logger "trx;LogFileName=macos-engine.trx" \
            --logger "console;verbosity=normal"

      # Expected to fail on System.Drawing.Common. Non-gating: we want the exact
      # failure recorded, because it decides whether the port needs a
      # cross-platform JPEG encoder (SkiaSharp/ImageSharp) or just a macOS skip.
      - name: Run ImageCompressionTests (expected to fail — evidence only)
        continue-on-error: true
        run: |
          dotnet test tests/MegaPDF.Core.Tests/MegaPDF.Core.Tests.csproj \
            -c Release --no-build \
            --filter "FullyQualifiedName~ImageCompressionTests" \
            --logger "console;verbosity=normal"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-engine-spike-results
          path: '**/TestResults/*.trx'
          if-no-files-found: warn

  # ==========================================================================
  # JOB 2 — the exploratory half. Two runners on purpose: the Windows half is
  # ADR-002 Option B's actual daily development loop (build and run the UI on
  # hardware we have), the macOS half is the part that can only happen in CI.
  #
  # The macOS half's real question is WHERE THE DYLIB HAS TO LIVE. .NET's
  # bare-name probing wants it beside the assembly (Contents/MacOS/); Apple
  # convention and library validation for a notarized app want it in
  # Contents/Frameworks/ signed with the same identity. We try the former and
  # log what ad-hoc codesign makes of it. No specific outcome is asserted here —
  # expect to iterate; the log is the deliverable.
  # ==========================================================================
  shell-spike-windows:
    name: Shell — Avalonia dev loop (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Generate fixtures
        shell: bash
        run: python3 tools/gen_test_fixtures.py "$RUNNER_TEMP/fixtures"

      - name: Build the shell spike
        run: dotnet build spike/macos-shell/MacShellSpike.csproj -c Release

      # Avalonia.Headless rather than launching a GUI: more reliable in CI, and
      # it is the assertion the dev loop would actually use.
      - name: Render page 1 of stamped.pdf headlessly
        shell: bash
        run: |
          dotnet run --project spike/macos-shell/MacShellSpike.csproj -c Release --no-build -- \
            "$RUNNER_TEMP/fixtures/stamped.pdf" --verify "$RUNNER_TEMP/windows-frame.png"

      - name: Upload rendered frame
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shell-spike-windows-frame
          path: ${{ runner.temp }}/windows-frame.png
          if-no-files-found: warn

  shell-spike-macos:
    name: Shell — .app bundle and launch (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Fetch pinned PDFium (macOS universal)
        run: tools/fetch-pdfium-mac.sh "$RUNNER_TEMP/pdfium-mac"

      - name: Generate fixtures
        run: python3 tools/gen_test_fixtures.py "$RUNNER_TEMP/fixtures"

      - name: Publish osx-arm64
        run: |
          dotnet publish spike/macos-shell/MacShellSpike.csproj \
            -c Release -r osx-arm64 --self-contained false \
            -o "$RUNNER_TEMP/publish"

      # Minimal .app skeleton — enough to answer the bundling and signing
      # questions, nowhere near a shippable bundle.
      - name: Assemble a minimal .app bundle
        run: |
          APP="$RUNNER_TEMP/MegaPDF-Spike.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp -R "$RUNNER_TEMP/publish/." "$APP/Contents/MacOS/"
          # Beside the assembly, where .NET's bare-name probing looks.
          cp "$RUNNER_TEMP/pdfium-mac/lib/libpdfium.dylib" "$APP/Contents/MacOS/"
          cat > "$APP/Contents/Info.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key><string>MegaPDF Spike</string>
              <key>CFBundleIdentifier</key><string>ca.electricrv.megapdf.spike</string>
              <key>CFBundleExecutable</key><string>MegaPDF.MacShellSpike</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>0.0.1</string>
              <key>LSMinimumSystemVersion</key><string>12.0</string>
              <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          echo "--- bundle contents:"; find "$APP" -maxdepth 3 | head -20

      # Ad-hoc signing only. Real Developer ID signing plus notarytool stapling
      # is ADR-002 §7 work; what we want here is early evidence of whether a
      # bare dylib in Contents/MacOS/ survives signing and launch at all.
      - name: Ad-hoc codesign and inspect
        continue-on-error: true
        run: |
          APP="$RUNNER_TEMP/MegaPDF-Spike.app"
          # Inside-out, NOT --deep: --deep is deprecated and signs nested code in the
          # wrong order for .NET bundles, so a failure would say nothing about real
          # Developer ID signing — which is the finding §7 is waiting on.
          codesign --force --sign - --timestamp=none "$APP/Contents/MacOS/libpdfium.dylib" || echo "::warning::dylib codesign failed"
          codesign --force --sign - --timestamp=none "$APP" || echo "::warning::bundle codesign failed"
          echo "--- verify:"; codesign --verify --verbose=2 "$APP" 2>&1 | head -20 || true
          echo "--- dylib arch:"; lipo -info "$APP/Contents/MacOS/libpdfium.dylib" || true

      - name: Run the bundle headlessly
        run: |
          APP="$RUNNER_TEMP/MegaPDF-Spike.app"
          "$APP/Contents/MacOS/MegaPDF.MacShellSpike" \
            "$RUNNER_TEMP/fixtures/stamped.pdf" --verify "$RUNNER_TEMP/macos-frame.png"

      - name: Upload rendered frame
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shell-spike-macos-frame
          path: ${{ runner.temp }}/macos-frame.png
          if-no-files-found: warn
