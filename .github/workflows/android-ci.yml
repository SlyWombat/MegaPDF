name: Android CI

on:
  # Lets a debug APK be built on demand for sideload testing, without waiting for
  # a push to main or a tagged release.
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', 'libs/pdfium/android/**', '.github/workflows/android-ci.yml']
  pull_request:
    branches: [main]
    paths: ['android/**', 'libs/pdfium/android/**', '.github/workflows/android-ci.yml']

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :engine:testDebugUnitTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: megapdf-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # Engine tests need real PDFium + Android graphics, so they run on an emulator.
  instrumented-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run instrumented engine tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          working-directory: android
          script: ./gradlew --no-daemon :engine:connectedDebugAndroidTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: android/engine/build/reports/androidTests/
