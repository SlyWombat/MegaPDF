name: Android CI

on:
  # Lets a debug APK be built on demand for sideload testing, without waiting for
  # a push to main or a tagged release.
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['core/**', 'android/**', 'libs/pdfium/android/**', '.github/workflows/android-ci.yml']
  pull_request:
    branches: [main]
    paths: ['core/**', 'android/**', 'libs/pdfium/android/**', '.github/workflows/android-ci.yml']

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # #624: pre-installs the NDK version Gradle will ask for anyway, with its own
      # retry-and-verify loop, so a corrupted download from Google's SDK repository is
      # caught here instead of failing the build below before any test runs.
      - name: Install Android NDK (retry on corrupted download)
        run: bash "$GITHUB_WORKSPACE/.github/scripts/install-ndk.sh"

      - name: Build and test
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :engine:testDebugUnitTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: megapdf-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # Engine tests need real PDFium + Android graphics, so they run on an emulator — and
  # the app's own UI tests (#346) run on the same one, right after: Compose tests that
  # drive the viewer's menus, gestures and pickers the way a person would.
  instrumented-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # #624: same corrupted-NDK-download exposure as build-and-test -- this job's
      # gradlew invocation also compiles :engine's native code.
      - name: Install Android NDK (retry on corrupted download)
        run: bash "$GITHUB_WORKSPACE/.github/scripts/install-ndk.sh"

      - name: Run instrumented engine and app tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          # A phone-sized screen for the app's UI tests; the runner's default AVD is a
          # 320 x 640 mdpi frame, which is no phone anyone holds.
          profile: pixel_5
          working-directory: android
          # #544: a bare "Process crashed" from the instrumentation runner leaves nothing
          # to read — the run was truncated and everything after it never happened. So the
          # gradle invocation is wrapped in a real script (see it for why this cannot be a
          # multi-line `script:` block here) that captures logcat for the run's full
          # duration and pulls off whatever tombstone or ANR trace the crash left,
          # regardless of outcome.
          script: bash "$GITHUB_WORKSPACE/.github/scripts/run-instrumented-tests.sh"

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: |
            android/engine/build/reports/androidTests/
            android/app/build/reports/androidTests/

      # #544: logcat for the whole run plus whatever tombstone or ANR trace the crash left,
      # so a truncated run is no longer a dead end — kept on failure only, the same as the
      # test reports above; a green run has nothing worth keeping.
      - name: Upload crash diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-crash-diagnostics
          path: |
            instrumented-logcat.txt
            instrumented-diagnostics/
          if-no-files-found: warn
