name: iOS Screenshots

# Manual: captures App Store screenshots from real simulators using the app's
# `-screenshot <state>` launch mode (viewer / text-edit / redact / text / search / sign / draw / home), at the two
# required sizes: 6.9" iPhone and 13" iPad, once per listing language (#91):
# en, fr-CA and fr (France) each get their own artifact. Download the artifact
# and upload the PNGs to App Store Connect (docs/app-store-listing.md maps them).
on:
  workflow_dispatch:
    inputs:
      language:
        description: "Which listing language to capture (all three by default)"
        type: choice
        default: all
        options: [all, en, fr-CA, fr]

jobs:
  capture:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.language == 'all' && '["en","fr-CA","fr"]' || format('["{0}"]', inputs.language)) }}
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Cache PDFium xcframework
        uses: actions/cache@v4
        with:
          path: ios/Vendor
          key: pdfium-ios-${{ hashFiles('libs/pdfium/RELEASE') }}-v5

      - name: Fetch PDFium and assemble xcframework
        run: bash scripts/fetch-pdfium.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # The MegaPDFDemo scheme, built for testing: the same MegaPDF.app as the
      # MegaPDF scheme's build, plus the UI-test runner that puts the iPad in
      # Full Screen Apps below (#406). Both land in the same products folder.
      - name: Build for simulator
        run: |
          xcodebuild build-for-testing \
            -project MegaPDF.xcodeproj \
            -scheme MegaPDFDemo \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO

      - name: Capture screenshots
        run: |
          APP="$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/MegaPDF.app"
          OUT="$RUNNER_TEMP/shots/${{ matrix.language }}"
          mkdir -p "$OUT"

          # The language is a launch argument (user-defaults override), so the
          # simulator's own language never has to change: -AppleLanguages picks
          # the catalog, -AppleLocale the number and date formats.
          LANG_ARGS=()
          case "${{ matrix.language }}" in
            fr-CA) LANG_ARGS=(-AppleLanguages "(fr-CA)" -AppleLocale fr_CA) ;;
            fr)    LANG_ARGS=(-AppleLanguages "(fr)" -AppleLocale fr_FR) ;;
          esac

          pick_device() {
            xcrun simctl list devices available -j | python3 -c "
          import json, re, sys
          pattern = sys.argv[1]
          data = json.load(sys.stdin)['devices']
          for devs in data.values():
              for dev in devs:
                  if re.search(pattern, dev['name']):
                      print(dev['udid'] + '|' + dev['name']); sys.exit(0)
          sys.exit(1)" "$1"
          }

          # Settings → Multitasking & Gestures → Full Screen Apps, driven by a UI
          # test (ios/MegaPDFUITests/CaptureSimulatorSetupUITests.swift), the same
          # way tools/ios-screenshots.sh does it. In Windowed Apps iPadOS 26 draws a
          # window-resize grabber in the corner of every app, and every iPad image
          # of the 2.1.1 CI set carried it because this step was missing (#406).
          ipad_full_screen() {
            local log
            log=$(xcodebuild test-without-building -project MegaPDF.xcodeproj -scheme MegaPDFDemo \
                    -destination "id=$1" -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO \
                    -only-testing:MegaPDFUITests/CaptureSimulatorSetupUITests 2>&1) || true
            printf '%s\n' "$log" | grep -E "Test Case .*(passed|failed)|error:" || true
            printf '%s\n' "$log" | grep -q "testIPadRunsAppsFullScreen\]' passed" \
              || { echo "::error::could not put $1 in Full Screen Apps"; return 1; }
          }

          capture() {
            local pattern="$1" label="$2"
            local picked udid name
            picked=$(pick_device "$pattern") || { echo "no device for $pattern"; return 1; }
            udid="${picked%%|*}"; name="${picked##*|}"
            echo "capturing on: $name"
            xcrun simctl boot "$udid" || true
            xcrun simctl bootstatus "$udid" -b
            # The first time a keyboard comes up on a fresh simulator, iOS covers
            # it with its QuickPath tip ("Swipe to type") — in the system language,
            # so in English on the French sets — and text-edit shot the tip instead
            # of the keyboard in all three 2.1.1 CI sets (#406). The in-house
            # simulators had shown it once and kept this flag; a runner's have
            # not. Set it the way a first keyboard would.
            xcrun simctl spawn "$udid" defaults write com.apple.keyboard.preferences \
              DidShowContinuousPathIntroduction -bool true
            case "$name" in iPad*) ipad_full_screen "$udid" ;; esac
            # A freshly booted simulator posts first-boot system banners ("Ready
            # for Apple Intelligence") for a while after bootstatus returns; one
            # landed on an iPad search shot. Let them come and go before any
            # capture, and launch the app once so its own first-run work is done.
            sleep 45
            xcrun simctl status_bar "$udid" override --time "9:41" \
              --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
            # A fresh container every time: the seeded demo library only appears when the
            # store is empty, and an in-house simulator keeps whatever a previous run or
            # UI test left behind (#100).
            xcrun simctl uninstall "$udid" com.megapdf.ios 2>/dev/null || true
            xcrun simctl install "$udid" "$APP"
            xcrun simctl ui "$udid" appearance light || true
            for state in viewer text-edit redact text search sign draw home; do
              xcrun simctl launch "$udid" com.megapdf.ios -screenshot "$state" "${LANG_ARGS[@]}"
              sleep 8
              xcrun simctl io "$udid" screenshot "$OUT/${label}-${state}.png"
              xcrun simctl terminate "$udid" com.megapdf.ios || true
              sleep 1
            done

            # Dark, for the two states that carry colour. Every token is defined
            # twice and the dark half is where a wrong value survives longest —
            # the Mac app had exactly that, a right banner beside a wrong button,
            # and only a dark screenshot showed it (#80). Two states rather than
            # six: these are the ones with accent in them.
            xcrun simctl ui "$udid" appearance dark || true
            for state in search sign; do
              xcrun simctl launch "$udid" com.megapdf.ios -screenshot "$state" "${LANG_ARGS[@]}"
              sleep 8
              xcrun simctl io "$udid" screenshot "$OUT/${label}-${state}-dark.png"
              xcrun simctl terminate "$udid" com.megapdf.ios || true
              sleep 1
            done
            xcrun simctl ui "$udid" appearance light || true

            xcrun simctl shutdown "$udid" || true
          }

          capture 'iPhone .*Pro Max' iphone-6_9
          capture 'iPad Pro 13' ipad-13
          ls -la "$OUT"

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: appstore-screenshots-${{ matrix.language }}
          path: ${{ runner.temp }}/shots/${{ matrix.language }}/
