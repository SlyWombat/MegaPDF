name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['android/**', 'libs/pdfium/android/**', 'ios/**']
  pull_request:
    branches: [main]
    paths-ignore: ['android/**', 'libs/pdfium/android/**', 'ios/**']

jobs:
  # The bundled notices must match the vendored license sets — a PDFium bump that
  # changes licenses/ would otherwise ship stale attribution silently. Runs on
  # Linux so the generator's LF output is compared against an LF checkout.
  notices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate and check for drift
        run: |
          python3 tools/gen_third_party_notices.py
          git diff --exit-code -- '*THIRD-PARTY-NOTICES.txt' \
            || { echo "::error::Third-party notices are stale — run tools/gen_third_party_notices.py and commit the result"; exit 1; }

      # The typed string accessors are generated from the English catalogues
      # (#91); an edited .resw/.resx without a regenerated Strings.g.cs would
      # otherwise compile against a key that is not there.
      - name: Regenerate string accessors and the France catalogues, check for drift
        run: |
          python3 tools/gen_strings.py fr-fr
          git diff --exit-code -- '*Strings.g.cs' 'src/MegaPDF.App/Strings/fr-FR' \
            'src/MegaPDF.Avalonia/Strings/Strings.fr.resx' 'android/app/src/main/res/values-fr' \
            'ios/MegaPDF/Localizable.xcstrings' \
            || { echo "::error::Generated strings are stale — run 'python3 tools/gen_strings.py fr-fr' and commit the result"; exit 1; }

  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build MegaPDF.sln --configuration Release

      - name: Test
        run: dotnet test MegaPDF.sln --configuration Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
