name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['android/**', 'libs/pdfium/android/**', 'ios/**']
  pull_request:
    branches: [main]
    paths-ignore: ['android/**', 'libs/pdfium/android/**', 'ios/**']

jobs:
  # The bundled notices must match the vendored license sets — a PDFium bump that
  # changes licenses/ would otherwise ship stale attribution silently. Runs on
  # Linux so the generator's LF output is compared against an LF checkout.
  notices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate and check for drift
        run: |
          python3 tools/gen_third_party_notices.py
          git diff --exit-code -- '*THIRD-PARTY-NOTICES.txt' \
            || { echo "::error::Third-party notices are stale — run tools/gen_third_party_notices.py and commit the result"; exit 1; }

  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build MegaPDF.sln --configuration Release

      - name: Test
        run: dotnet test MegaPDF.sln --configuration Release --no-build --logger "trx;LogFileName=results.trx"

      # Windows was the one platform that could not photograph itself (#84), which
      # is why its half of the brand-token work was the only one applied without
      # anyone seeing the result. --screenshot renders the XAML tree, so unlike
      # tools/screenshots-windows/ it needs no synthetic input and no desktop to
      # itself. Whether that holds on a runner as well as on a real desktop is
      # exactly what this step is here to establish.
      - name: What the Windows app looks like
        run: |
          dotnet build src\MegaPDF.App\MegaPDF.App.csproj -c Release -r win-x64 --nologo -v q
          python tools\gen_test_fixtures.py "${env:RUNNER_TEMP}\fixtures"
          $exe = "src\MegaPDF.App\bin\Release\net8.0-windows10.0.19041.0\win-x64\MegaPDF.exe"
          $out = "${env:RUNNER_TEMP}\shots"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $pdf = "${env:RUNNER_TEMP}\fixtures\demo.pdf"

          & $exe --screenshot "$out\01-empty-state.png"
          & $exe $pdf --screenshot-state find --screenshot "$out\02-find.png"
          & $exe $pdf --screenshot-state mode --screenshot "$out\03-mode-banner.png"
          & $exe $pdf --theme dark --screenshot "$out\04-dark-document.png"
          & $exe $pdf --theme dark --screenshot-state find --screenshot "$out\05-dark-find.png"
          Get-ChildItem $out

      - name: Upload Windows screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-screenshots
          path: '${{ runner.temp }}\shots'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
