# The MegaPDF snap (#158): builds it, installs it, and runs the app under strict
# confinement on a real Ubuntu 24.04 machine with snapd and AppArmor — a GitHub runner is
# a VM, not a container, which is what makes the confinement here the real one.
#
# Nothing is uploaded unless all three hold: the run was started by hand, the `upload`
# input was ticked, and the SNAPCRAFT_STORE_CREDENTIALS secret exists. It does exist as of
# 2026-09-28 (revision 1, 2.1.1, on edge); how it was made, and how to remake it when it
# expires, is in tools/Linux-Packaging.md, "The Snap Store". The upload goes to the edge
# channel, which no one is on unless they ask for it.
#
# Promotion to stable used to be described here as "a click in the Snap Store dashboard,
# never this workflow". That was a policy, not a limitation — the stored login carries
# package_release on edge AND stable — and it meant the one go-live that could be automated
# was the one that required a browser. The `promote` input below does it instead, with the
# same opt-in shape as `upload`: started by hand, explicitly ticked, and refusing without
# the credential. Promoting is still a deliberate, public act; it is just no longer a
# dashboard-only one (Dave, 2026-10-02, asked for exactly this from a phone).
name: Snap

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to the Snap Store's edge channel (needs the SNAPCRAFT_STORE_CREDENTIALS secret)
        required: true
        default: false
        type: boolean
      promote:
        description: "Promote an EXISTING revision to stable. Give the revision number in promote_revision; builds nothing, uploads nothing."
        required: false
        default: false
        type: boolean
      promote_revision:
        description: "The revision to promote to stable, e.g. 2. Read it off the Snap Store or an upload's output; never guessed."
        required: false
        default: ""
        type: string
  push:
    branches: [main]
    paths:
      - 'src/MegaPDF.Avalonia/**'
      - 'src/MegaPDF.Core/**'
      - 'core/**'
      - 'libs/pdfium/**'
      - 'tools/build-linux-app.sh'
      - 'tools/linux/**'
      - '.github/workflows/snap.yml'
  pull_request:
    paths:
      - 'src/MegaPDF.Avalonia/**'
      - 'src/MegaPDF.Core/**'
      - 'core/**'
      - 'libs/pdfium/**'
      - 'tools/build-linux-app.sh'
      - 'tools/linux/**'
      - '.github/workflows/snap.yml'

jobs:
  snap:
    name: Snap (build, strict confinement)
    # 24.04 by name, not ubuntu-latest: `snapcraft pack --destructive-mode` builds a core24
    # snap only on the release core24 is made from.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build desktop-file-utils squashfs-tools

      - name: Build the app tree
        run: tools/build-linux-app.sh linux-x64 "$RUNNER_TEMP/linux"

      - name: Snapcraft
        run: |
          sudo snap install snapcraft --classic
          snapcraft --version

      # Built as root (the gnome extension installs its SDK through snapd), and then handed
      # back: review-tools is itself a confined snap and cannot read a root-owned file.
      - name: Build the snap
        run: |
          sudo tools/linux/build-snap.sh "$RUNNER_TEMP/linux/MegaPDF" "$RUNNER_TEMP/snap"
          sudo chown -R "$USER" "$RUNNER_TEMP/snap"

      # The Snap Store's own checks run again on upload; snapcraft's linter says most of
      # what they will. Reported rather than enforced, like lintian for the .deb.
      - name: What snapcraft's linter makes of it
        continue-on-error: true
        run: |
          sudo snap install review-tools
          /snap/bin/review-tools.snap-review "$RUNNER_TEMP"/snap/megapdf_*_amd64.snap || true

      # dbus-user-session puts the session bus under the user's systemd manager, which is
      # where snapd asks for the transient scope it tracks a snap in.
      - name: Desktop session tools for the check
        run: |
          sudo apt-get install -y -qq xvfb dbus dbus-x11 dbus-user-session x11-utils \
            xdotool metacity xdg-desktop-portal xdg-desktop-portal-gtk poppler-utils

      - name: Generate fixtures
        run: |
          python3 tools/gen_test_fixtures.py "$RUNNER_TEMP/fixtures"
          python3 tools/gen_redaction_fixtures.py "$RUNNER_TEMP/fixtures"
          # #457: dynamic-xfa.pdf/hybrid-xfa.pdf, the self-test's "dynamic XFA" check.
          python3 tools/gen_xfa_fixtures.py "$RUNNER_TEMP/fixtures"
          # #481: signed-approval.pdf/signed-certified.pdf, the self-test's "signed document" check.
          # #576 adds signed-reason.pdf (a signing date and a signer's reason, which the
          # save question names) and signature-field-unsigned.pdf (a signature field with
          # no signature in it: #476 §5b's false positive).
          python3 tools/gen_signature_fixtures.py "$RUNNER_TEMP/fixtures"

      # A step is a child of the runner's system service, and snapd will not start a snap
      # from there ("… is not a snap cgroup"): it tracks each snap process in a scope under
      # the user's own systemd manager. Lingering starts that manager with no login, and
      # systemd-run puts the check inside it, where a terminal on a desktop would be.
      - name: A user session for the check
        run: |
          sudo loginctl enable-linger "$USER"
          for _ in $(seq 1 60); do
            systemctl is-active --quiet "user@$(id -u).service" && break
            sleep 1
          done
          systemctl is-active "user@$(id -u).service"

      - name: Install the snap and run the app under strict confinement
        run: |
          sudo systemd-run --machine="$USER@.host" --user --pipe --wait --quiet --collect \
            --working-directory="$GITHUB_WORKSPACE" \
            "$GITHUB_WORKSPACE/tools/linux/check-snap.sh" \
            "$(ls "$RUNNER_TEMP"/snap/megapdf_*_amd64.snap)" \
            "$RUNNER_TEMP/fixtures" "$RUNNER_TEMP/linux/MegaPDF"

      - uses: actions/upload-artifact@v4
        with:
          name: MegaPDF-snap
          path: ${{ runner.temp }}/snap/megapdf_*_amd64.snap
          if-no-files-found: error

      # Off unless asked for, and off without the credential: see the top of this file.
      - name: Upload to the edge channel
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload }}
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          if [ -z "$SNAPCRAFT_STORE_CREDENTIALS" ]; then
            echo "::error::no SNAPCRAFT_STORE_CREDENTIALS secret; see tools/Linux-Packaging.md, \"The Snap Store\""
            exit 1
          fi
          snapcraft upload --release=edge "$(ls "$RUNNER_TEMP"/snap/megapdf_*_amd64.snap)"

  # Promotion only. Builds nothing and uploads nothing: it moves a revision that is
  # already in the store onto the stable channel, which is the Linux go-live.
  #
  # Separate job, not a step on the build, so a promote dispatch does not spend twenty
  # minutes rebuilding a snap the store already has — and so the thing that makes a
  # release public is visible on its own in the run list rather than buried in a build.
  promote:
    name: Snap (promote a revision to stable)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.promote }}
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse without a revision
        run: |
          if [ -z "${{ inputs.promote_revision }}" ]; then
            echo "::error::promote needs promote_revision - the revision number to put on stable."
            echo "::error::Read it off https://snapcraft.io/megapdf/releases or an upload's output. Never guess it:"
            echo "::error::promoting the wrong revision publishes the wrong build to everyone on stable."
            exit 1
          fi
          case "${{ inputs.promote_revision }}" in
            ''|*[!0-9]*) echo "::error::promote_revision must be a plain number, got '${{ inputs.promote_revision }}'"; exit 1 ;;
          esac

      - name: Set up snapcraft
        run: |
          sudo snap install snapcraft --classic
          snapcraft --version

      - name: Promote to stable
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          REV: ${{ inputs.promote_revision }}
        run: |
          if [ -z "$SNAPCRAFT_STORE_CREDENTIALS" ]; then
            echo "::error::no SNAPCRAFT_STORE_CREDENTIALS secret; see tools/Linux-Packaging.md, \"The Snap Store\""
            exit 1
          fi
          echo "revision $REV -> stable"
          snapcraft release megapdf "$REV" stable

      - name: Read the channels back from the store
        run: |
          # The store, not the tool's own say-so. A promotion that did not take should
          # not look like one that did.
          curl -sS -H 'Snap-Device-Series: 16' \
            "https://api.snapcraft.io/v2/snaps/info/megapdf" \
            | jq -r '.["channel-map"][] | "\(.channel.name)\t\(.version)\trev \(.revision)"'
