# The MegaPDF snap (#158): builds it, installs it, and runs the app under strict
# confinement on a real Ubuntu 24.04 machine with snapd and AppArmor — a GitHub runner is
# a VM, not a container, which is what makes the confinement here the real one.
#
# Nothing is uploaded unless all three hold: the run was started by hand, the `upload`
# input was ticked, and the SNAPCRAFT_STORE_CREDENTIALS secret exists. It does not exist
# yet. Creating it is Dave's step, in tools/Linux-Packaging.md, "The Snap Store", and
# even then the upload goes to the edge channel, which no one is on unless they ask for
# it. Promotion to stable is a click in the Snap Store dashboard, never this workflow.
name: Snap

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to the Snap Store's edge channel (needs the SNAPCRAFT_STORE_CREDENTIALS secret)
        required: true
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - 'src/MegaPDF.Avalonia/**'
      - 'src/MegaPDF.Core/**'
      - 'core/**'
      - 'libs/pdfium/**'
      - 'tools/build-linux-app.sh'
      - 'tools/linux/**'
      - '.github/workflows/snap.yml'
  pull_request:
    paths:
      - 'src/MegaPDF.Avalonia/**'
      - 'src/MegaPDF.Core/**'
      - 'core/**'
      - 'libs/pdfium/**'
      - 'tools/build-linux-app.sh'
      - 'tools/linux/**'
      - '.github/workflows/snap.yml'

jobs:
  snap:
    name: Snap (build, strict confinement)
    # 24.04 by name, not ubuntu-latest: `snapcraft pack --destructive-mode` builds a core24
    # snap only on the release core24 is made from.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build desktop-file-utils squashfs-tools

      - name: Build the app tree
        run: tools/build-linux-app.sh linux-x64 "$RUNNER_TEMP/linux"

      - name: Snapcraft
        run: |
          sudo snap install snapcraft --classic
          snapcraft --version

      # Built as root (the gnome extension installs its SDK through snapd), and then handed
      # back: review-tools is itself a confined snap and cannot read a root-owned file.
      - name: Build the snap
        run: |
          sudo tools/linux/build-snap.sh "$RUNNER_TEMP/linux/MegaPDF" "$RUNNER_TEMP/snap"
          sudo chown -R "$USER" "$RUNNER_TEMP/snap"

      # The Snap Store's own checks run again on upload; snapcraft's linter says most of
      # what they will. Reported rather than enforced, like lintian for the .deb.
      - name: What snapcraft's linter makes of it
        continue-on-error: true
        run: |
          sudo snap install review-tools
          /snap/bin/review-tools.snap-review "$RUNNER_TEMP"/snap/megapdf_*_amd64.snap || true

      # dbus-user-session puts the session bus under the user's systemd manager, which is
      # where snapd asks for the transient scope it tracks a snap in.
      - name: Desktop session tools for the check
        run: |
          sudo apt-get install -y -qq xvfb dbus dbus-x11 dbus-user-session x11-utils \
            xdotool metacity xdg-desktop-portal xdg-desktop-portal-gtk poppler-utils

      - name: Generate fixtures
        run: |
          python3 tools/gen_test_fixtures.py "$RUNNER_TEMP/fixtures"
          python3 tools/gen_redaction_fixtures.py "$RUNNER_TEMP/fixtures"

      # A step is a child of the runner's system service, and snapd will not start a snap
      # from there ("… is not a snap cgroup"): it tracks each snap process in a scope under
      # the user's own systemd manager. Lingering starts that manager with no login, and
      # systemd-run puts the check inside it, where a terminal on a desktop would be.
      - name: A user session for the check
        run: |
          sudo loginctl enable-linger "$USER"
          for _ in $(seq 1 60); do
            systemctl is-active --quiet "user@$(id -u).service" && break
            sleep 1
          done
          systemctl is-active "user@$(id -u).service"

      - name: Install the snap and run the app under strict confinement
        run: |
          sudo systemd-run --machine="$USER@.host" --user --pipe --wait --quiet --collect \
            --working-directory="$GITHUB_WORKSPACE" \
            "$GITHUB_WORKSPACE/tools/linux/check-snap.sh" \
            "$(ls "$RUNNER_TEMP"/snap/megapdf_*_amd64.snap)" \
            "$RUNNER_TEMP/fixtures" "$RUNNER_TEMP/linux/MegaPDF"

      - uses: actions/upload-artifact@v4
        with:
          name: MegaPDF-snap
          path: ${{ runner.temp }}/snap/megapdf_*_amd64.snap
          if-no-files-found: error

      # Off unless asked for, and off without the credential: see the top of this file.
      - name: Upload to the edge channel
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload }}
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          if [ -z "$SNAPCRAFT_STORE_CREDENTIALS" ]; then
            echo "::error::no SNAPCRAFT_STORE_CREDENTIALS secret; see tools/Linux-Packaging.md, \"The Snap Store\""
            exit 1
          fi
          snapcraft upload --release=edge "$(ls "$RUNNER_TEMP"/snap/megapdf_*_amd64.snap)"
