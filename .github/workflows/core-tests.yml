# The shared engine core, built and tested where the code lives (#104, ADR-003):
# the same assertions the platform suites make, run against core/ itself on all
# three operating systems, with AddressSanitizer on Linux. A divergence in the
# core fails here, on the same commit, instead of three platform jobs later.
name: Core tests

on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'tools/fetch-pdfium-linux.sh'
      - 'tools/fetch-pdfium-mac.sh'
      - 'libs/pdfium/RELEASE'
      - 'tools/gen_test_fixtures.py'
      - 'tools/gen_redaction_fixtures.py'
      - 'tools/leakcheck/**'
      - 'tools/structure-check/**'
      - 'tools/compare_cli_pdftotext.py'
      - 'tests/MegaPDF.Core.Tests/Fixtures/**'
      - '.github/workflows/core-tests.yml'
  pull_request:
    paths:
      - 'core/**'
      - 'tools/fetch-pdfium-linux.sh'
      - 'tools/fetch-pdfium-mac.sh'
      - 'libs/pdfium/RELEASE'
      - 'tools/gen_test_fixtures.py'
      - 'tools/gen_redaction_fixtures.py'
      - 'tools/leakcheck/**'
      - 'tools/structure-check/**'
      - 'tools/compare_cli_pdftotext.py'
      - 'tests/MegaPDF.Core.Tests/Fixtures/**'
      - '.github/workflows/core-tests.yml'
  workflow_dispatch:

jobs:
  core:
    name: core on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            fetch: tools/fetch-pdfium-linux.sh
            asan: 'ON'
            generator: -G Ninja
          - os: macos-latest
            fetch: tools/fetch-pdfium-mac.sh
            asan: 'OFF'
            generator: -G Ninja
          - os: windows-latest
            fetch: ''
            asan: 'OFF'
            generator: -A x64
    steps:
      - uses: actions/checkout@v4

      - name: Ninja
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # cmark (#357): the CommonMark oracle for the Markdown writer's round-trip test,
          # Linux-only per design §3 ("A CommonMark round trip on the Linux leg").
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get install -y -qq ninja-build qpdf poppler-utils cmark; else brew install ninja; fi

      - name: Fetch the pinned PDFium prebuilt
        if: matrix.fetch != ''
        shell: bash
        run: ${{ matrix.fetch }}

      - name: Generate fixtures
        shell: bash
        run: |
          python3 tools/gen_test_fixtures.py "$RUNNER_TEMP/fixtures"
          # The #173 redaction fixtures land in the same directory; the names do not clash.
          python3 tools/gen_redaction_fixtures.py "$RUNNER_TEMP/fixtures"

      - name: Configure
        shell: bash
        run: |
          cmake -S core -B "$RUNNER_TEMP/core-build" ${{ matrix.generator }} \
            -DCMAKE_BUILD_TYPE=Debug \
            -DMEGAPDF_CORE_TESTS=ON -DMEGAPDF_ASAN=${{ matrix.asan }} \
            -DMEGAPDF_FIXTURES_DIR="$RUNNER_TEMP/fixtures"

      - name: Build
        shell: bash
        run: cmake --build "$RUNNER_TEMP/core-build" --config Debug

      # On Linux the tests also keep every document they save (MEGAPDF_SAVED_DIR, #126),
      # for the qpdf check below.
      - name: Test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            export MEGAPDF_SAVED_DIR="$RUNNER_TEMP/saved"
            mkdir -p "$MEGAPDF_SAVED_DIR"
          fi
          cd "$RUNNER_TEMP/core-build" && ctest -C Debug --output-on-failure

      # #355: the built megapdf-cli binary, run as a plain user would run it (no MEGAPDF_*
      # env vars, no test harness), against #353's fixtures, diffed byte-for-byte against the
      # goldens core_tests.cpp itself compares megapdf_write_text()'s return value against.
      # ctest above already proves the writer's own output is right and that the CLI's stdout
      # matches it exactly for one fixture (test_cli_smoke); this proves the *shipped binary*
      # gives the same answer for every #353 fixture, on every OS's own shell and line
      # endings -- the acceptance criterion in #355 itself ("works on Windows (PowerShell and
      # cmd), macOS and Linux from a plain shell").
      - name: megapdf-cli smoke against the structure fixtures
        shell: bash
        run: |
          # GitHub Actions runs a bash `run:` step with `-e` by default, which would abort the
          # whole step the instant scan.pdf's expected exit 5 happens, before its own exit-code
          # check below even runs. `set +e` turns that off; `$rc` is checked explicitly instead.
          set +e
          set -u
          BIN="$RUNNER_TEMP/core-build/megapdf-cli"
          [ "$RUNNER_OS" = "Windows" ] && BIN="$RUNNER_TEMP/core-build/Debug/megapdf-cli.exe"
          [ -x "$BIN" ] || { echo "::error::$BIN is missing"; exit 1; }
          fail=0
          for name in columns furniture lists headings xobject-text scan mixed; do
            pdf="tests/MegaPDF.Core.Tests/Fixtures/structure/$name.pdf"
            golden="core/tests/expected/structure/$name.txt"
            got="$RUNNER_TEMP/$name.cli.txt"
            "$BIN" extract "$pdf" --quiet > "$got"
            rc=$?
            # scan.pdf exits 5 (no text on any page); every other fixture here exits 0. A
            # nonzero rc past that is the real failure signal; the golden diff below is the
            # content check either way.
            if [ "$name" = "scan" ]; then
              [ "$rc" -eq 5 ] || { echo "::error title=exit code::$name expected 5, got $rc"; fail=1; }
            else
              [ "$rc" -eq 0 ] || { echo "::error title=exit code::$name expected 0, got $rc"; fail=1; }
            fi
            if ! diff -u "$golden" "$got"; then
              echo "::error title=megapdf-cli output does not match its golden::$name"
              fail=1
            fi
            # #357: --format md against the same fixture, same exit-code expectation.
            md_golden="core/tests/expected/structure/$name.md"
            md_got="$RUNNER_TEMP/$name.cli.md"
            "$BIN" extract "$pdf" --format md --quiet > "$md_got"
            md_rc=$?
            if [ "$name" = "scan" ]; then
              [ "$md_rc" -eq 5 ] || { echo "::error title=exit code::$name --format md expected 5, got $md_rc"; fail=1; }
            else
              [ "$md_rc" -eq 0 ] || { echo "::error title=exit code::$name --format md expected 0, got $md_rc"; fail=1; }
            fi
            if ! diff -u "$md_golden" "$md_got"; then
              echo "::error title=megapdf-cli --format md output does not match its golden::$name"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "megapdf-cli: 7 fixtures match their txt and md goldens"

      # Informational only (design #142 §7 measure 3's own precedent: poppler is another
      # heuristic, not truth): a rough token-multiset overlap between megapdf-cli's plain-text
      # output and `pdftotext`'s, over the same fixtures, so a large divergence is visible in
      # the log without gating the build on it (poppler and this heuristic are free to
      # disagree on wrapping/reading order; #354's own battery is where the real fidelity gate
      # lives, against PDFium's own text, not against a second heuristic).
      - name: megapdf-cli vs pdftotext token overlap (informational)
        if: runner.os == 'Linux'
        shell: bash
        run: python3 tools/compare_cli_pdftotext.py "$RUNNER_TEMP/core-build/megapdf-cli" "$(pwd)"

      # #126: what the core writes must be a valid PDF by an independent reader, not only
      # by PDFium reopening its own output. qpdf --check exits 2 on errors (the job fails)
      # and 3 on warnings (reported, not failed). A document that needs a password to open
      # is skipped: checking it would mean putting the password on a command line.
      - name: qpdf --check the saved documents
        if: runner.os == 'Linux'
        shell: bash
        run: |
          files=0; ok=0; warned=0; failed=0; skipped=0
          for f in "$RUNNER_TEMP"/saved/*.pdf; do
            [ -e "$f" ] || continue
            files=$((files + 1))
            name=$(basename "$f")
            if qpdf --requires-password "$f" >/dev/null 2>&1; then
              skipped=$((skipped + 1))
              continue
            fi
            rc=0
            out=$(qpdf --check "$f" 2>&1) || rc=$?
            case $rc in
              0) ok=$((ok + 1)) ;;
              3) warned=$((warned + 1))
                 echo "::warning title=qpdf warnings::$name"
                 printf '%s\n' "$out" | grep -i 'warning' || true ;;
              *) failed=$((failed + 1))
                 echo "::error title=qpdf --check failed::$name (exit $rc)"
                 printf '%s\n' "$out" ;;
            esac
          done
          echo "qpdf --check: $files files, $ok ok, $warned with warnings, $failed with errors, $skipped skipped (need a password to open)"
          if [ "$files" -eq 0 ]; then echo "::error::the core tests kept no saved documents"; exit 1; fi
          [ "$failed" -eq 0 ]

      # #241: what "Remove protection" wrote must be a plain file to a reader that is not
      # PDFium. qpdf must say it is not encrypted, and pdftotext must read the fixture's
      # text out of it without being given anything. The core test checks the bytes; this
      # checks that two other readers agree.
      - name: the copies with protection removed are plain
        if: runner.os == 'Linux'
        shell: bash
        run: |
          files=0
          for f in "$RUNNER_TEMP"/saved/remove-protection-*.pdf; do
            [ -e "$f" ] || continue
            files=$((files + 1))
            name=$(basename "$f")
            enc=$(qpdf --show-encryption "$f" 2>&1)
            if [ "$enc" != "File is not encrypted" ]; then
              echo "::error title=still encrypted::$name: $enc"
              exit 1
            fi
            if ! pdftotext "$f" - | grep -q "MegaPDF protection fixture"; then
              echo "::error title=a second reader cannot read it::$name"
              exit 1
            fi
          done
          if [ "$files" -eq 0 ]; then echo "::error::no copies with protection removed were kept"; exit 1; fi
          echo "$files copies with protection removed: not encrypted, and readable by qpdf and pdftotext"
