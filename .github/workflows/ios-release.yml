name: iOS Release

# Tag a commit `ios-v0.1.0` (etc.) to archive with cloud-managed signing and
# upload to TestFlight — no Mac involved (#24). Prereqs (all in place):
# secrets ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8 / APPLE_TEAM_ID, the
# registered bundle id com.megapdf.ios, and an App Store Connect app record.
on:
  push:
    tags: ['ios-v*']

jobs:
  testflight:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      # The image default (Xcode 26.6, iOS 26.5 SDK) draws ITMS-90426 on every
      # delivery — the "use the current public (GM) version of Xcode" boilerplate
      # points at a beta/RC toolchain. Pin the previous Xcode on the image.
      - name: Select stable Xcode
        run: |
          ls -d /Applications/Xcode*.app
          # Explicit pin, two releases behind the image default: deliveries
          # built with 26.6/iOS 26.5 SDK are rejected with ITMS-90426.
          for v in 26.4.1 26.4 26.3.0; do
            if [ -d "/Applications/Xcode_$v.app" ]; then
              PICK="/Applications/Xcode_$v.app"; break
            fi
          done
          echo "selecting: $PICK"
          sudo xcode-select -s "$PICK"
          xcodebuild -version

      - name: Cache PDFium xcframework
        uses: actions/cache@v4
        with:
          path: ios/Vendor
          key: pdfium-ios-chromium-7934-v3

      - name: Fetch PDFium and assemble xcframework
        run: bash scripts/fetch-pdfium.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Set signing team
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: sed -i '' "s/TEAMID_PLACEHOLDER/$APPLE_TEAM_ID/" project.yml

      - name: Generate Xcode project
        run: xcodegen generate

      # Manual signing with a real distribution cert + App Store profile
      # (minted via the ASC API — the fastlane-match approach without
      # fastlane). Xcode-account cloud signing does not work on an
      # accountless runner.
      - name: Import signing identity and profile
        env:
          IOS_DIST_P12_B64: ${{ secrets.IOS_DIST_P12_B64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          IOS_DIST_PROFILE_B64: ${{ secrets.IOS_DIST_PROFILE_B64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          printf '%s' "$IOS_DIST_P12_B64" | base64 -d > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" \
            -P "$IOS_DIST_P12_PASSWORD" -A -t cert -f pkcs12
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KEYCHAIN"
          # Xcode 16+ scans UserData/Provisioning Profiles; older tooling and
          # altool use MobileDevice. Install to both.
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            printf '%s' "$IOS_DIST_PROFILE_B64" | base64 -d \
              > "$dir/MegaPDF_App_Store.mobileprovision"
          done
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Archive (manual distribution signing)
        run: |
          MARKETING="${GITHUB_REF_NAME#ios-v}"
          xcodebuild archive \
            -project MegaPDF.xcodeproj \
            -scheme MegaPDF \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MegaPDF.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="MegaPDF App Store" \
            MARKETING_VERSION="$MARKETING" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"


      - name: Archive diagnostics
        run: |
          APP="$RUNNER_TEMP/MegaPDF.xcarchive/Products/Applications/MegaPDF.app"
          echo "--- archive contents:"; ls "$RUNNER_TEMP/MegaPDF.xcarchive"
          echo "--- MinimumOSVersion:"; /usr/libexec/PlistBuddy -c Print:MinimumOSVersion "$APP/Info.plist" || true
          echo "--- DTXcode / DTSDKName:"
          /usr/libexec/PlistBuddy -c Print:DTXcode "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c Print:DTSDKName "$APP/Info.plist" || true
          echo "--- swift link references:"; otool -L "$APP/MegaPDF" | grep -i swift | head -5 || true
          echo "--- Frameworks:"; ls "$APP/Frameworks" || true

      - name: Export IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.megapdf.ios</key><string>MegaPDF App Store</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/MegaPDF.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      # The signed IPA as an artifact: lets manual uploads (Windows
      # iTMSTransporter -v eXtreme) capture server-side validation detail
      # that altool does not surface.
      - name: Save IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: megapdf-ipa
          path: ${{ runner.temp }}/export/*.ipa

      # Transporter's verbose verify prints the raw server-side validation
      # conversation that altool reduces to terse ITMS emails.
      - name: Transporter verbose verify + upload
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s\n' "$ASC_KEY_P8" \
            > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa)
          set +e
          xcrun iTMSTransporter -m verify -assetFile "$IPA" \
            -apiKey "$ASC_KEY_ID" -apiIssuer "$ASC_ISSUER_ID" \
            -v eXtreme > "$RUNNER_TEMP/transporter-verify.log" 2>&1
          VERIFY_RC=$?
          set -e
          echo "verify exit code: $VERIFY_RC"
          echo "=== errors/warnings from verify ==="
          grep -inE "error|warn|fail|swift|reject" "$RUNNER_TEMP/transporter-verify.log" | tail -60 || true
          echo "=== last 40 lines ==="
          tail -40 "$RUNNER_TEMP/transporter-verify.log"
          if [ "$VERIFY_RC" -eq 0 ]; then
            xcrun altool --upload-app -t ios -f "$IPA" \
              --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          fi

      - name: Save Transporter log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transporter-verify-log
          path: ${{ runner.temp }}/transporter-verify.log
