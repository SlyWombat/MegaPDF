name: iOS Release

# Tag a commit `ios-v0.1.0` (etc.) to archive with cloud-managed signing and
# upload to TestFlight — no Mac involved (#24). Prereqs (all in place):
# secrets ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8 / APPLE_TEAM_ID, the
# registered bundle id com.megapdf.ios, and an App Store Connect app record.
on:
  push:
    tags: ['ios-v*']

jobs:
  testflight:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Cache PDFium xcframework
        uses: actions/cache@v4
        with:
          path: ios/Vendor
          key: pdfium-ios-chromium-7934-v1

      - name: Fetch PDFium and assemble xcframework
        run: bash scripts/fetch-pdfium.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Set signing team
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: sed -i '' "s/TEAMID_PLACEHOLDER/$APPLE_TEAM_ID/" project.yml

      - name: Generate Xcode project
        run: xcodegen generate

      # Manual signing with a real distribution cert + App Store profile
      # (minted via the ASC API — the fastlane-match approach without
      # fastlane). Xcode-account cloud signing does not work on an
      # accountless runner.
      - name: Import signing identity and profile
        env:
          IOS_DIST_P12_B64: ${{ secrets.IOS_DIST_P12_B64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          IOS_DIST_PROFILE_B64: ${{ secrets.IOS_DIST_PROFILE_B64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          printf '%s' "$IOS_DIST_P12_B64" | base64 -d > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" \
            -P "$IOS_DIST_P12_PASSWORD" -A -t cert -f pkcs12
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KEYCHAIN"
          # Xcode 16+ scans UserData/Provisioning Profiles; older tooling and
          # altool use MobileDevice. Install to both.
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            printf '%s' "$IOS_DIST_PROFILE_B64" | base64 -d \
              > "$dir/MegaPDF_App_Store.mobileprovision"
          done
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Archive (manual distribution signing)
        run: |
          MARKETING="${GITHUB_REF_NAME#ios-v}"
          xcodebuild archive \
            -project MegaPDF.xcodeproj \
            -scheme MegaPDF \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MegaPDF.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="MegaPDF App Store" \
            MARKETING_VERSION="$MARKETING" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"

      # destination: upload lets xcodebuild deliver the package itself — the
      # organizer-style path that assembles SwiftSupport internally. A bare
      # exported IPA pushed via altool gets rejected with ITMS-90426.
      - name: Export and upload to TestFlight
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys" "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" \
            > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          cat > "$RUNNER_TEMP/ExportOptions.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.megapdf.ios</key><string>MegaPDF App Store</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/MegaPDF.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
