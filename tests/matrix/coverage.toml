# The #330 coverage map: every feature against every platform, checked against the tree.
#
# Read tools/qa/check-matrix.py's header first — it says why this is a feature × platform
# map with proof per cell rather than the feature × action × state × platform grid #330
# originally asked for, and what the validator enforces. docs/qa/test-matrix.md is
# generated from this file and both are checked for drift on every push.
#
# Each cell says two separate things, because this week's three holes were failures of the
# first kind and no amount of the second would have caught them:
#
#   presence  does the feature exist on this platform, and is there a route to it?
#   coverage  does a test in CI exercise it, and at what level?
#
# `entry` is the route — a toolbar button, a menu row, a screen, an activation filter —
# and the validator insists it resolves AND lives in that platform's menu/toolbar/screen
# layer (meta.platform.<id>.entry_roots). Those lists deliberately exclude the destination
# windows and dialogs themselves: #571 was an About window and a notices window that both
# existed, under Views/, with nothing in any menu leading to them. Anchoring About on
# AboutWindow.axaml would have "proved" presence while the feature was unreachable, so
# AboutWindow.axaml is not an entry root and the anchor has to be the menu row.
#
# `coverage` is one of:
#   ui      — a test that runs in CI drives this platform's own UI or view model
#   engine  — only the shared core is tested; nothing proves this platform reaches it
#   none    — present, reachable, nothing automated
#   n/a     — the feature is not on this platform (see `absence`)
# `engine` is a level of its own on purpose. "The core can redact" and "this app's Redact
# button redacts" are different claims, and #401 (a Windows click did nothing) and #412
# (the desktops opened to a dead toolbar) both lived in the gap between them.
#
# `tests` are `path::symbol` and both halves are resolved. In reverse, every test file in
# the tree, every Avalonia `--self-test` Check* section and every Windows self-test state
# CI runs must be cited by some cell or carry an `[[exempt]]` with a reason — that is what
# keeps this file from going quietly stale as tests are added.
#
# #598: an iOS `coverage = "ui"` cell citing an `ios/MegaPDFUITests/*.swift` suite must
# also cite the `.github/workflows/ios-ci.yml` text that runs it (the `-only-testing`
# line), the same way a Windows cell cites `.github/workflows/ci.yml::Run-Check "..."`.
# ios-ci.yml names each UI suite on its own line, duplicated across an iPhone and an iPad
# lane, and a conflict that drops one line keeps the job green with no warning — citing
# only the test file never noticed, because the conflict never touches that file. Citing
# the line means a dropped line breaks a citation here instead.
#
# Coverage here means "something looks at it", never "it works": the suites themselves say
# that. And none of it replaces the by-hand pass in docs/RELEASING.md §2.3, which is still
# the release gate and still where every 2.1.1 show-stopper was found.

[meta]
order = ["windows", "macos", "linux", "ios", "android"]

