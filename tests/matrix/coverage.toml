[[feature]]
id = "special-documents"
title = "Protected, restricted, XFA and damaged documents"
area = "Cross-cutting"
about = """
The documents that are not a happy path: permission bits that must disable tools, dynamic
XFA that must explain itself rather than pretend, signed documents, and files that are
simply broken. The corpus batteries are where these are met at scale (TESTING.md).

Signed documents carry two separate claims here. #481's is that a save about to destroy a
signature says so first. #576's is the other half: a signature our own save has already
destroyed must not go on presenting itself, so the person is asked whether to leave it out
of the file being written, and the file that is written then reports what it really is."""
[feature.windows]
presence = "present"
entry = "src/MegaPDF.App/DocumentViewModel.cs::DocumentCapabilities"
coverage = "engine"
tests = [
  "tests/MegaPDF.Core.Tests/DocumentCapabilitiesTests.cs::Capabilities",
  "tests/MegaPDF.Core.Tests/DynamicXfaTests.cs::Xfa",
  "tests/MegaPDF.Core.Tests/SignatureDetectionTests.cs::Detect",
  "tests/MegaPDF.Core.Tests/CorpusTests.cs::corpus",
]
note = "the gating rules are tested; no self-test state opens a restricted or XFA document in the UI."
[feature.macos]
presence = "present"
entry = "src/MegaPDF.Avalonia/ViewModels/DocumentViewModel.cs::DocumentCapabilities"
coverage = "ui"
tests = [
  "tests/MegaPDF.Core.Tests/DocumentCapabilitiesTests.cs::Capabilities",
  "tests/MegaPDF.Core.Tests/DynamicXfaTests.cs::Xfa",
  "tests/MegaPDF.Core.Tests/SignatureDetectionTests.cs::Detect",
  "src/MegaPDF.Avalonia/Program.cs::CheckDeadSignature",
  "src/MegaPDF.Avalonia/Program.cs::CheckSignedSaveQuestion",
]
note = "the self-test opens a dynamic-XFA document and a signed one and checks what the window offers (#457, #481); #576 adds the signed-save question itself, driven in a real window, and asserts on the wording the person would have read rather than only on what happened next."
[feature.linux]
presence = "present"
entry = "src/MegaPDF.Avalonia/ViewModels/DocumentViewModel.cs::DocumentCapabilities"
coverage = "ui"
tests = [
  "tests/MegaPDF.Core.Tests/DocumentCapabilitiesTests.cs::Capabilities",
  "tests/MegaPDF.Core.Tests/DynamicXfaTests.cs::Xfa",
  "tests/MegaPDF.Core.Tests/SignatureDetectionTests.cs::Detect",
  "src/MegaPDF.Avalonia/Program.cs::CheckDeadSignature",
  "src/MegaPDF.Avalonia/Program.cs::CheckSignedSaveQuestion",
]
note = "as macOS."
[feature.ios]
presence = "present"
entry = "ios/MegaPDF/ViewerModel.swift::capabilities"
coverage = "ui"
tests = [
  "ios/MegaPDFTests/DynamicXfaTests.swift::class",
  "ios/MegaPDFTests/DocumentCapabilitiesTests.swift::class",
  "ios/MegaPDFTests/SignatureDetectionTests.swift::class",
  "ios/MegaPDFTests/PagesFieldHierarchyTests.swift::class",
]
note = "PdfEngineTests also feeds the engine invalid bytes."
[feature.android]
presence = "present"
entry = "android/app/src/main/java/com/megapdf/android/ViewerScreen.kt::R.string.signed_overwrite_title"
coverage = "ui"
tests = [
  "android/app/src/androidTest/java/com/megapdf/android/DynamicXfaTest.kt::class",
  "android/app/src/androidTest/java/com/megapdf/android/SignatureOverwriteTest.kt::class",
  "android/engine/src/androidTest/java/com/megapdf/engine/DocumentFlagsTest.kt::class",
]
note = "the signed-document overwrite question has an instrumented test here; #576's choice to remove a dead signature is on the Avalonia desktops only so far, so Android, Windows and iOS still warn about a signature our own save has already destroyed."

[[feature]]
id = "packaged-install"
title = "The build a user installs (MSIX, App Store sandbox, .deb, Snap, Flatpak, tarball)"
area = "Cross-cutting"
about = """
#330 asked for the install matrix explicitly, and it is the dimension CI covers best on
Linux and least everywhere else: the Linux jobs install the real package in clean
containers and run the app out of it, while Windows, macOS, iOS and Android are all tested
as dev builds in CI and as real installs only by hand (docs/RELEASING.md §2.3)."""
[feature.windows]
presence = "present"
