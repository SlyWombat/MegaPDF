coverage = "engine"
tests = [".github/workflows/ci.yml::Store packages, both architectures, and what is in them"]
manual = "docs/RELEASING.md::Add-AppxPackage"
note = "the MSIX's identity, architecture and resource map are checked; nothing runs the installed MSIX in CI, which is where #401 was."
[feature.macos]
