# XcodeGen spec — the committed source of truth for the Xcode project.
# Run `ios/scripts/fetch-pdfium.sh` first (assembles Vendor/pdfium.xcframework),
# then `xcodegen generate`. The .xcodeproj and Vendor/ are gitignored.
name: MegaPDF
options:
  bundleIdPrefix: com.megapdf
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_INCLUDE_PATHS: $(SRCROOT)/Vendor/pdfium/include
targets:
  MegaPDF:
    type: application
    platform: iOS
    sources: [MegaPDF]
    dependencies:
      # Dynamic libpdfium.dylib — must be embedded (and signed) in the bundle.
      - framework: Vendor/pdfium.xcframework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.megapdf.ios
        PRODUCT_NAME: MegaPDF
        # Substituted by ios-release.yml before xcodegen; CI simulator builds
        # run with CODE_SIGNING_ALLOWED=NO and never evaluate it.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: TEAMID_PLACEHOLDER
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        TARGETED_DEVICE_FAMILY: "1,2"
  MegaPDFTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MegaPDFTests]
    dependencies:
      - target: MegaPDF
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MegaPDF:
    build:
      targets:
        MegaPDF: all
    test:
      targets: [MegaPDFTests]
